  const pwrType=q('h-pwr')?q('h-pwr').value:'titanium';
  const pwrTypeLabel=pwrType==='dc'?'DC (-48V)':'Titanium (AC)';

  const specBoxW=Math.max(specW,680);
  sRect(specG,{x:0,y:0,width:specBoxW,height:82,rx:8,fill:'#FFFFFF',stroke:'#E0E0E0','stroke-width':1});
  sRect(specG,{x:0,y:0,width:specBoxW,height:28,rx:8,fill:'#0067C5'});
  sRect(specG,{x:0,y:14,width:specBoxW,height:14,fill:'#0067C5'});
  sText(specG,14,19,'Cabinet Configuration — drag items between cabinets',{fill:'#FFFFFF','font-size':'13px','font-weight':'700'});
  sText(specG,specBoxW-14,19,'Rack View',{fill:'rgba(255,255,255,0.75)','font-size':'11px','text-anchor':'end','font-weight':'600'});
  sText(specG,14,46,`${cabConfig.height_u}U · ${cabConfig.width_mm}mm W × ${cabConfig.depth_mm}mm D · ${cabConfig.door.replace(/_/g,' ')} · Sides: ${cabConfig.side_panels?'Yes':'No'} · Cable entry: ${cabConfig.cable_entry}`,
    {fill:'#4A4A4A','font-size':'11px'});
  sText(specG,14,62,`Rail: 19" EIA (${rackKitLabel}) · Power: ${pwrTypeLabel} · PDU: ${cabPwrLabel} · Cabinets: ${numCabs} · Spacing: ${cabSpacing}mm`,
    {fill:'#6F6F6F','font-size':'10px'});
  if(issues.length){
    const errCount=issues.filter(i=>i.sev==='error').length;
    const warnCount=issues.filter(i=>i.sev==='warning').length;
    const statusTxt=(errCount?errCount+' error(s)':'')+(errCount&&warnCount?', ':'')+(warnCount?warnCount+' warning(s)':'');
    sText(specG,14,76,statusTxt,{fill:errCount?'#C62828':'#A85D00','font-size':'11px','font-weight':'600'});
  }else{
    sText(specG,14,76,'✓ All components compatible',{fill:'#0E6027','font-size':'11px','font-weight':'600'});
  }

  const rackTop=specY+106;
  const cabs=[];
  rackCabs=[];
  for(let i=0;i<numCabs;i++){
    const cx=60+i*(cabW+cabSpacing);
    const cab={x:cx,y:rackTop,w:cabW,h:cabH,
      ix:cx+16+equipGap, iy:rackTop+16, iw:cabW-32-equipGap*2, ih:cabH-32,
      pduLx:cx+10, pduRx:cx+cabW-10-pduW, cabU, uH};
    cabs.push(cab);
    rackCabs.push(cab);
    sRect(svg,{x:cab.x,y:cab.y,width:cab.w,height:cab.h,rx:6,fill:'url(#gC)',stroke:'#D0D0D0','stroke-width':1.5,filter:'url(#sh)'});
    // RU number labels on left
    for(let u=1;u<=cabU;u++){
      const yy=cab.iy+cab.ih-u*uH;
      if(u%5===0){
        sText(svg,cab.ix-8,yy+uH/2+3,u,{fill:'#6F6F6F','font-size':'9px','font-family':'monospace','text-anchor':'end'});
        sLine(svg,cab.ix-14,yy+uH,cab.ix-2,yy+uH,'#D0D0D0',0.5);
      }else{
        sLine(svg,cab.ix-6,yy+uH,cab.ix-2,yy+uH,'#333',0.3);
      }
    }
    sText(svg,cab.x+cab.w/2,cab.y-8,`Cabinet ${i+1}`,{fill:'#1C1C1C','font-size':'12px','text-anchor':'middle','font-weight':'bold'});
    // capacity label
    const usedU=rackItems.filter(r=>r.cabIdx===i).reduce((s,r)=>s+r.ru,0);
    const capClr=usedU>cabU?'#C62828':usedU>cabU*0.85?'#A85D00':'#0E6027';
    sText(svg,cab.x+cab.w/2,cab.y+cab.h+14,`${usedU}/${cabU}U used · ${cabConfig.width_mm}×${cabConfig.depth_mm}mm`,{fill:capClr,'font-size':'10px','text-anchor':'middle','font-weight':'600'});
    sText(svg,cab.x+cab.w/2,cab.y+cab.h+26,`${cabConfig.door.replace(/_/g,' ')} · Cable: ${cabConfig.cable_entry}`,{fill:'#666','font-size':'9px','text-anchor':'middle'});

    const doorLabel=cabConfig.door==='no_front_no_rear'?'Open Frame':cabConfig.door==='perforated_front_solid_rear'?'Perf+Solid':'Perforated';
    sRect(svg,{x:cab.x+4,y:cab.y+4,width:50,height:12,rx:2,fill:'#E8F1FC'});
    sText(svg,cab.x+29,cab.y+13,doorLabel,{fill:'#0067C5','font-size':'8px','text-anchor':'middle','font-weight':'600'});
    if(cabConfig.cable_entry==='top'||cabConfig.cable_entry==='both')
      sRect(svg,{x:cab.x+cab.w/2-20,y:cab.y,width:40,height:4,rx:1,fill:'#0E6027',opacity:0.6});
    if(cabConfig.cable_entry==='bottom'||cabConfig.cable_entry==='both')
      sRect(svg,{x:cab.x+cab.w/2-20,y:cab.y+cab.h-4,width:40,height:4,rx:1,fill:'#0E6027',opacity:0.6});

    // PDU strips
    for(const side of ['A','B']){
      const px=side==='A'?cab.pduLx:cab.pduRx;
      sRect(svg,{x:px,y:cab.iy,width:pduW,height:cab.ih,rx:2,fill:'#FEF2F2',stroke:'#C62828','stroke-width':0.8});
      sText(svg,px+pduW/2,cab.iy+12,`PDU ${side}`,{fill:'#C62828','font-size':'9px','text-anchor':'middle','font-weight':'700'});
      const maxOutlets=Math.floor((cab.ih-20)/12);
      for(let o=0;o<maxOutlets;o++){
        sRect(svg,{x:px+3,y:cab.iy+20+o*12,width:pduW-6,height:10,rx:1,fill:'#FFFFFF',stroke:'#D0D0D0','stroke-width':0.3});
      }
    }
  }

  // ── Place rack items using stored positions ──
  for(let idx=0;idx<rackItems.length;idx++){
    const it=rackItems[idx];
    if(it.cabIdx>=numCabs) it.cabIdx=numCabs-1;
    const cab=cabs[it.cabIdx]; if(!cab)continue;
    const yy=cab.iy+cab.ih-(it.startU+it.ru)*uH;
    const bx=cab.ix+2, bw=cab.iw-4, bh=it.ru*uH-2;
    const box={x:bx,y:yy,w:bw,h:bh};

    // draggable group
    const g=sGrp(svg,{transform:`translate(0,0)`,style:'cursor:grab','data-rack-idx':idx});
    sRect(g,{x:bx,y:yy,width:bw,height:bh,rx:2,fill:it.fill,stroke:it.stroke,'stroke-width':1.2});
    sRect(g,{x:bx,y:yy,width:bw,height:12,rx:1,fill:it.stroke,opacity:0.85});
    sText(g,bx+bw/2,yy+10,it.label,{fill:'#fff','font-size':'10px','text-anchor':'middle','font-weight':'600'});

    // RU badge
    sRect(g,{x:bx+bw-28,y:yy+bh-14,width:26,height:12,rx:2,fill:'#FFFFFF',stroke:'#D0D0D0','stroke-width':0.5});
    sText(g,bx+bw-15,yy+bh-5,`U${it.startU+1}`,{fill:'#6F6F6F','font-size':'9px','text-anchor':'middle'});

    if(it.type==='controller'&&bh>20){
      for(let p=0;p<4;p++) sRect(g,{x:bx+8+p*14,y:yy+18,width:10,height:Math.min(10,bh-22),rx:1,fill:p<2?'#48bb78':'#718096',stroke:'#222','stroke-width':0.4});
      sRect(g,{x:bx+bw-42,y:yy+4,width:18,height:bh-8,rx:1,fill:'url(#gP)',stroke:'#222','stroke-width':0.4});
      sRect(g,{x:bx+bw-22,y:yy+4,width:18,height:bh-8,rx:1,fill:'url(#gP)',stroke:'#222','stroke-width':0.4});
    }
    if(it.type==='shelf'&&bh>20){
      const cols=12,dw=Math.floor((bw-8)/cols);
      for(let d=0;d<24;d++){const dc=d%cols,dr=Math.floor(d/cols);
        sRect(g,{x:bx+4+dc*dw,y:yy+14+dr*12,width:dw-1,height:Math.min(10,bh-18),rx:1,fill:d<(c.drivesPerShelf||24)?'#4a6741':'#1a1f26',stroke:'#333','stroke-width':0.2});}
    }
    // ── Drag event on group ──
    g.addEventListener('mousedown',function(e){
      if(simView!=='rack')return;
      e.stopPropagation();
      rackDrag={idx,startMouseX:e.clientX,startMouseY:e.clientY,origCab:it.cabIdx,origU:it.startU};
      svg.style.cursor='grabbing';
    });
  }

  // HA-pair grouping brackets
  const drawnGroups=new Set();
  for(const it of rackItems){
    if(!it.group||drawnGroups.has(it.group))continue;
    drawnGroups.add(it.group);
    const members=rackItems.filter(o=>o.group===it.group);
    if(members.length<2)continue;
    const cab=cabs[members[0].cabIdx]; if(!cab)continue;
    const allSameCab=members.every(m=>m.cabIdx===members[0].cabIdx);
    if(!allSameCab)continue;
    const minU=Math.min(...members.map(m=>m.startU));
    const maxU=Math.max(...members.map(m=>m.startU+m.ru));
    const gy=cab.iy+cab.ih-maxU*uH;
    const gh=(maxU-minU)*uH;
    sRect(svg,{x:cab.ix-1,y:gy-1,width:cab.iw+2,height:gh+2,rx:3,fill:'none',stroke:'#0067C5','stroke-width':2,'stroke-dasharray':'6,3',opacity:0.6});
    const haLbl=members[0].ha!==undefined?getHaLabel(members[0].ha):'HA';
    sText(svg,cab.ix+cab.iw+6,gy+gh/2+4,haLbl,{fill:'#0067C5','font-size':'10px','font-weight':'700'});
  }

  // U-grid overlay
  for(let i=0;i<numCabs;i++){const cab=cabs[i];for(let u=0;u<cabU;u++){const yy=cab.iy+u*uH;
    sRect(svg,{x:cab.ix,y:yy,width:cab.iw,height:uH,fill:'none',stroke:'#E0E0E0','stroke-width':0.15,rx:0.5});}}


  // Inter-cabinet spacing
  for(let i=0;i<numCabs-1;i++){const a=cabs[i],b=cabs[i+1];const my=a.y+a.h+28;
    sLine(svg,a.x+a.w,my,b.x,my,'#0E6027',1,'4,3');
    sText(svg,(a.x+a.w+b.x)/2,my-4,`${cabSpacing} mm`,{fill:'#A85D00','font-size':'9px','text-anchor':'middle','font-weight':'bold'});}

  const totalW=numCabs*(cabW+cabSpacing)+120;
  const totalH=rackTop+cabH+60;
  svg.setAttribute('viewBox',`0 0 ${totalW} ${totalH}`);
  svg.style.width=totalW+'px'; svg.style.height=totalH+'px';

  updateConfigStatus();
}

/* ═══════════════════════════════════════════════════════════════
   PORT INTERACTION — DRAG & DROP CABLING
   ═══════════════════════════════════════════════════════════════ */
let dragFromPort=null;

function onPortMouseDown(e,data,el){
  if(simView!=='cabling'&&simView!=='back')return;
  e.stopPropagation();
  // Start drag
  dragFromPort=data;
  selPort=data.id;
  el.classList.add('sel');
  // Highlight compatible ports
  for(const[pid,p]of Object.entries(portElMap)){
    if(pid===data.id)continue;
    if(isCompatible(data,p.data)) p.el.classList.add('compat');
  }
  // Create drag line
  const svg=q('simsvg');
  const r=el.getBoundingClientRect(), sr=svg.getBoundingClientRect();
  const pz=getPanZoom();
  const cx=(r.left+r.width/2-sr.left-pz.x)/pz.s;
  const cy=(r.top+r.height/2-sr.top-pz.y)/pz.s;
  dragLine=sLine(svg,cx,cy,cx,cy,'#f6e05e',2,'4,2');
  dragLine.style.pointerEvents='none';
}

function finishDrag(e){
  if(!dragFromPort||!dragLine)return;
  const svg=q('simsvg');
  // Find target port under cursor
  const els=document.elementsFromPoint(e.clientX,e.clientY);
  let target=null;
  for(const el of els){
    if(el.classList&&el.classList.contains('port-rect')&&el!==portElMap[dragFromPort.id]?.el){
      try{ target=JSON.parse(el.getAttribute('data-port')); }catch(ex){}
      break;
    }
  }
  if(target&&isCompatible(dragFromPort,target)){
    // Check if already connected
    const exists=cableConns.some(c=>(c.from===dragFromPort.id&&c.to===target.id)||(c.from===target.id&&c.to===dragFromPort.id));
    if(!exists){
      cableConns.push({from:dragFromPort.id,to:target.id,fromData:dragFromPort,toData:target});
      // Consume BOM
      consumeBom(dragFromPort,target);
    }
  }
  cancelDrag();
  renderSim();
}

function cancelDrag(){
  if(dragLine&&dragLine.parentNode)dragLine.parentNode.removeChild(dragLine);
  dragLine=null; dragFromPort=null; selPort=null;
  for(const p of Object.values(portElMap)){
    p.el.classList.remove('sel','compat');
  }
}

function isCompatible(a,b){
  if(a.id===b.id)return false;
  // Same media type can connect
  if(a.media===b.media)return true;
  // RJ45 can connect to RJ45
  if(a.media==='RJ45'&&b.media==='RJ45')return true;
  return false;
}

function consumeBom(from,to){
  const media=from.media;
  const ci=bomStock.findIndex(b=>b.media===media&&b.cat==='cable');
  if(ci>=0) bomStock[ci].used++;
  const pi=bomStock.findIndex(b=>b.media===media&&b.cat==='pluggable');
  if(pi>=0) bomStock[pi].used+=2;
  renderBomPanel();
}

let _drawCableGen=0;
function drawExistingCables(svg){
  const gen=++_drawCableGen;
  const doDraw=()=>{
    if(gen!==_drawCableGen)return;
    const sr=svg.getBoundingClientRect();
    if(sr.width===0||sr.height===0){
      setTimeout(doDraw,80);
      return;
    }
    const pz=getPanZoom();
    for(const[pid,p]of Object.entries(portElMap)){
      const r=p.el.getBoundingClientRect();
      p.cx=(r.left+r.width/2-sr.left-pz.x)/pz.s;
      p.cy=(r.top+r.height/2-sr.top-pz.y)/pz.s;
    }
    for(const c of cableConns){
      const from=portElMap[c.from], to=portElMap[c.to];
      if(!from||!to)continue;
      if(isNaN(from.cx)||isNaN(from.cy)||isNaN(to.cx)||isNaN(to.cy))continue;
      const role=c.fromData.role||c.toData.role||'data';
      const roleKey=normalizeCableRole(role);
      if(cableRoleFilter!=='all'&&roleKey!==cableRoleFilter) continue;
      const clr=CABLE_COLORS[role]||'#8b949e';
      const legEntry=CABLE_LEGEND.find(l=>l.role===role);
      const dash=legEntry?legEntry.dash:'';
      const dx=Math.abs(to.cx-from.cx)*0.4;
      const d=`M${from.cx},${from.cy} C${from.cx+dx},${from.cy} ${to.cx-dx},${to.cy} ${to.cx},${to.cy}`;
      const path=sPath(svg,d,clr,2.5,'cable-path');
      if(dash) path.setAttribute('stroke-dasharray',dash);
      path.setAttribute('stroke-linecap','round');
      path.addEventListener('contextmenu',e=>{
        e.preventDefault();
        cableConns=cableConns.filter(cc=>cc!==c);
        returnBom(c.fromData,c.toData);
        renderSim();
      });
      path.addEventListener('mouseenter',()=>{path.setAttribute('stroke-width','4');path.setAttribute('opacity','1');});
      path.addEventListener('mousemove',e=>showCableTip(e,c));
      path.addEventListener('mouseleave',()=>{path.setAttribute('stroke-width','2.5');path.setAttribute('opacity','0.85');hideCableTip();});
      path.setAttribute('opacity','0.85');
    }
  };
  setTimeout(doDraw,60);
}

function returnBom(from,to){
  const media=from.media;
  const ci=bomStock.findIndex(b=>b.media===media&&b.cat==='cable');
  if(ci>=0) bomStock[ci].used=Math.max(0,bomStock[ci].used-1);
  const pi=bomStock.findIndex(b=>b.media===media&&b.cat==='pluggable');
  if(pi>=0) bomStock[pi].used=Math.max(0,bomStock[pi].used-2);
  renderBomPanel();
}

function getPanZoom(){
  const svg=q('simsvg');
  const t=svg.style.transform;
  if(!t||t==='none')return{x:0,y:0,s:1};
  const tm=t.match(/translate\(([-\d.]+)px[, ]+([-\d.]+)px\)/);
  const sm=t.match(/scale\(([-\d.]+)\)/);
  return{x:tm?+tm[1]:0,y:tm?+tm[2]:0,s:sm?+sm[1]:1};
}

/* ── PORT TOOLTIP ── */
function showPortTip(e,data){
  let tip=q('port-tip');
  if(!tip){tip=document.createElement('div');tip.id='port-tip';tip.className='ptip';q('cwrap').appendChild(tip);}
  const media=data.media, speed=data.speed, role=data.role;
  const connCount=cableConns.filter(c=>c.from===data.id||c.to===data.id).length;
  const available=bomStock.filter(b=>b.media===media&&b.cat==='cable').map(b=>`${b.part}: ${b.total-b.used} left`).join('<br>');
  const sfpAvail=bomStock.filter(b=>b.media===media&&b.cat==='pluggable').map(b=>`${b.part}: ${b.total-b.used} left`).join('<br>');
  tip.innerHTML=`<span class="ptip-close" onclick="hideTip()">✕</span>
    <div class="ptip-title">${data.ctrl==='sw'?data.slot:('Ctrl '+data.ctrl+' Slot '+data.slot)} Port ${data.port}</div>
    <div class="ptip-row"><span>Media:</span><strong>${media}</strong></div>
    <div class="ptip-row"><span>Speed:</span><strong>${speed}</strong></div>
    <div class="ptip-row"><span>Role:</span><strong style="color:${ROLE_CLR[role]||'#fff'}">${role}</strong></div>
    <div class="ptip-row"><span>Connected:</span><strong>${connCount}</strong></div>
    ${(simView==='cabling'||simView==='back')?`<hr style="border-color:#30363d;margin:6px 0">
    <div style="font-size:10px;color:#8b949e">📦 Available from BOM:</div>
    <div style="font-size:10px">${available||'—'}</div>
    ${sfpAvail?`<div style="font-size:10px">${sfpAvail}</div>`:''}
    <div style="font-size:10px;color:#f6ad55;margin-top:4px">↕ Drag to connect</div>`:''}`;
  const cw=q('cwrap'),cr=cw.getBoundingClientRect();
  tip.style.left=Math.min(e.clientX-cr.left+12,cr.width-270)+'px';
  tip.style.top=(e.clientY-cr.top-10)+'px';
  tip.style.display='block';
}
function hideTip(){const tip=q('port-tip');if(tip)tip.style.display='none';}

function updateSite(){

  const ctrlN=c.haPairs*2;
  const shN=c.totalShelves||0;
  const totalDrv=c.totalDrives||s.totalDrives;
  const baseW=p.pwr?p.pwr.base:1000;
  const ctTw=ctrlN*(baseW*0.65),ctMw=ctrlN*baseW;
  const shelfW=p.pwr?p.pwr.shelf:250;
  const shTw=shN*(shelfW*0.65),shMw=shN*shelfW;
  const dTw=totalDrv*drv.tw,dMw=totalDrv*drv.mw;
  const swN=c.sw&&c.sw.needSwitch?c.sw.pairCount*2:0;
  const swW=swN*250;
  const tTw=ctTw+shTw+dTw,tMw=ctMw+shMw+dMw+swW;

  sc2('sp-pwr',`<table class="t"><tr><th></th><th>Typical</th><th>Max</th></tr>
    <tr><td>Controllers (${ctrlN})</td><td>${ctTw} W</td><td>${ctMw} W</td></tr>
    ${shN?`<tr><td>Shelves (${shN})</td><td>${shTw} W</td><td>${shMw} W</td></tr>`:''}
    <tr><td>Drives (${totalDrv})</td><td>${dTw} W</td><td>${dMw} W</td></tr>
    ${swN?`<tr><td>Switches (${swN})</td><td>${(swW*0.65).toFixed(0)} W</td><td>${swW} W</td></tr>`:''}

/* ═══════════════════════════════════════════════════════════════
   SYNC BACK TO PARENT — update subscription context via postMessage
   ═══════════════════════════════════════════════════════════════ */
function syncBackToParent(r,instanceRuns,agg){
  try{
    const sw=r.sw||{};
    const runs=instanceRuns&&instanceRuns.length?instanceRuns:[r];
    const totals=agg||{
      haPairs:r.haPairs,totalDrives:r.totalDrives,shelves:r.shelves,rawTB:r.raw_tb,committedTiB:r.committed_tib
    };
    const instanceSummaries=runs.map((ir,idx)=>{
      const ic=instanceConfigs[idx]||{};
      const ql=(quoteContext.instanceList||[])[idx]||{};
      return{
        index:idx,
        label:ic.workloadLabel||('Instance '+(idx+1)),
        workloadId:ql.workloadId||ic.workloadId||'',
        psl:ic.psl||quoteContext.psl||'Premium',
        protocol:ir.protocol,
        platform:ir.platform?ir.platform.model:r.platform.model,
        haPairs:ir.haPairs||1,
        totalDrives:ir.totalDrives||0,
        shelves:ir.shelves||0,
        rawTB:ir.raw_tb||0,
        capacityTiB:ir.committed_tib||0
      };
    });
    const msg={
      type:'hwConfigUpdate',
      instanceIndex:currentInstanceIdx,
      instanceCount:instanceConfigs.length,
      capacityTiB:r.committed_tib,
      protocol:r.protocol,
      platform:r.platform.model,
      haPairs:totals.haPairs,
      totalDrives:totals.totalDrives,
      shelves:totals.shelves,
      rawTB:totals.rawTB,
      capacityTiBTotal:totals.committedTiB,
      instanceSummaries:instanceSummaries,
      switchRequired:sw.switchRequired||'Not needed',
      switchFamily:sw.sw?sw.sw.name:'',
      switchPairCount:sw.pairCount||0,
      switchPortsConsumed:sw.perSwConsumed||0,
      switchPortsFree:sw.freePorts||0,
      switchWatts:sw.switchWatts||0
    };
    if(window.parent&&window.parent!==window){
      window.parent.postMessage(msg,'*');
    }
    sessionStorage.setItem('hwConfigResult',JSON.stringify(msg));
  }catch(e){}
}

/* ═══════════════════════════════════════════════════════════════
   LOAD QUOTE CONTEXT FROM PARENT (sessionStorage)
   ═══════════════════════════════════════════════════════════════ */
(function loadQuoteContext(){
  try{
    const raw=sessionStorage.getItem('hwConfigContext');
    if(raw){
      const ctx=JSON.parse(raw);
      console.log('[HW-CFG] Loaded context from sessionStorage:',JSON.stringify(ctx,null,2));
      if(ctx.psl) quoteContext.psl=ctx.psl;
      if(ctx.capacityTiB) quoteContext.capacityTiB=ctx.capacityTiB;
      if(ctx.instances) quoteContext.instances=Math.max(1,ctx.instances);
      if(ctx.protocol) quoteContext.protocol=ctx.protocol;
      if(ctx.instanceList) quoteContext.instanceList=ctx.instanceList;
    }else{
      console.warn('[HW-CFG] No hwConfigContext in sessionStorage — using defaults');
    }
  }catch(e){console.error('[HW-CFG] Error loading context:',e);}

  initInstanceConfigs();
  const ic=instanceConfigs[0]||quoteContext;

  if(q('qc-psl')) q('qc-psl').textContent=ic.psl||quoteContext.psl;
  if(q('qc-cap')) q('qc-cap').textContent=(ic.capacityTiB||quoteContext.capacityTiB)+' TiB';
  if(q('qc-inst')) q('qc-inst').textContent=instanceConfigs.length;

  if(q('s-proto')) q('s-proto').value=ic.protocol||quoteContext.protocol;
  if(q('s-cap')){
    q('s-cap').value=ic.capacityTiB||quoteContext.capacityTiB;
    if(q('s-cap-num')) q('s-cap-num').value=ic.capacityTiB||quoteContext.capacityTiB;
  }
  ensureDefaultAdapterRows();
  updateInstanceNav();
})();
