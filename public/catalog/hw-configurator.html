<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hardware Configurator</title>
<style>
/* Blueprint Design System — Light Theme */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:#F5F5F5;color:#1C1C1C;overflow:hidden}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 24px;background:#FFFFFF;border-bottom:1px solid #E0E0E0;flex-wrap:wrap}
.hdr-main{display:flex;flex-direction:column;gap:2px;flex:1;min-width:200px}
.hdr h1{font-size:17px;font-weight:600;color:#1C1C1C}
.hdr .sub{font-size:13px;color:#6F6F6F}
.hdr-actions{display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap}
.btn-hw-draft{padding:10px 16px;border:1px solid #D0D0D0;border-radius:6px;background:#FFFFFF;color:#1C1C1C;font-weight:600;cursor:pointer;font-size:13px}
.btn-hw-draft:hover{background:#F5F5F5;border-color:#B0B0B0}
.btn-hw-draft:focus{outline:2px solid #0067C5;outline-offset:2px}
.btn-approve-return{padding:10px 18px;border:none;border-radius:6px;background:#0E6027;color:#fff;font-weight:600;cursor:pointer;font-size:13px;line-height:1.25;text-align:center}
.btn-approve-return:hover{background:#0a4d1f}
.btn-approve-return:focus{outline:2px solid #0067C5;outline-offset:2px}
.tabs{display:flex;gap:0;padding:0 24px;background:#FFFFFF;border-bottom:1px solid #E0E0E0}
.tbtn{padding:10px 22px;border:none;background:transparent;color:#6F6F6F;font-size:14px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;transition:.15s}
.tbtn:hover{color:#1C1C1C;background:#F5F5F5}
.tbtn.on{color:#0067C5;border-bottom-color:#0067C5;background:transparent}
.tpanel{display:none;height:calc(100vh - 90px);overflow:auto}
.tpanel.on{display:flex;flex-direction:column}
#t2{flex-direction:row!important;position:relative}
#drawer{width:560px;min-width:400px;max-width:75vw;border-right:none;overflow-y:auto;padding:18px 20px;background:#FFFFFF;flex-shrink:0}
#resize-handle{width:6px;cursor:col-resize;background:#E0E0E0;flex-shrink:0;transition:background .15s;position:relative;z-index:10}
#resize-handle:hover,#resize-handle.dragging{background:#0067C5}
#simpanel{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column;min-width:250px}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:20px}
.sc{background:#FFFFFF;border:1px solid #E0E0E0;border-radius:8px;padding:16px}
.sc h3{font-size:13px;color:#6F6F6F;margin-bottom:10px}
.sc select,.sc input[type=number]{width:100%;padding:8px 10px;border:1px solid #D0D0D0;border-radius:6px;background:#FFFFFF;color:#1C1C1C;font-size:14px}
.sc.off{opacity:.35;pointer-events:none}
.sc input[type=range]{width:100%;accent-color:#0067C5}
.rv{text-align:center;font-size:18px;font-weight:700;color:#0067C5;margin-top:6px}
.hs{margin-bottom:14px;border:1px solid #E0E0E0;border-radius:8px;padding:16px;background:#FFFFFF}
.hs h3{font-size:14px;color:#1C1C1C;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.hs label{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#4A4A4A;margin-bottom:8px;gap:10px}
.hs label span{flex:1}
.hs input[type=number],.hs input[type=text]{width:110px;padding:5px 10px;border:1px solid #D0D0D0;border-radius:5px;background:#FFFFFF;color:#1C1C1C;text-align:right;font-size:13px}
.hs input[readonly]{opacity:.5;cursor:default;background:#F5F5F5}
.hs select{padding:5px 10px;border:1px solid #D0D0D0;border-radius:5px;background:#FFFFFF;color:#1C1C1C;font-size:13px}
.hs input[type=checkbox]{width:18px;height:18px;accent-color:#0067C5}
.hs.off{opacity:.35;pointer-events:none}
.rg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.rb{border-radius:8px;padding:10px;text-align:center}
.rb .rl{font-size:11px;opacity:.7;margin-bottom:2px}
.rb .rv2{font-size:16px;font-weight:700}
.rb.bl{background:#E8F1FC;color:#0053A5}.rb.cy{background:#E4F7FB;color:#00758F}
.rb.gr{background:#E6F5EC;color:#0E6027}.rb.or{background:#FFF2E0;color:#A85D00}
.rb.pu{background:#F0E8FC;color:#5B21B6}.rb.te{background:#E4F7F4;color:#047857}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:8px 12px;text-align:left;border-bottom:1px solid #E0E0E0}
table.t th{color:#6F6F6F;font-weight:600}
table.t .tot td{border-top:2px solid #D0D0D0;font-weight:700;color:#0067C5}
.bp{padding:6px 14px;border:none;border-radius:6px;background:#0067C5;color:#fff;font-weight:600;cursor:pointer;font-size:12px}
.bp:hover{background:#0053A5}
.bp.sm{padding:4px 10px;font-size:11px;background:#F5F5F5;color:#1C1C1C;border:1px solid #D0D0D0;border-radius:4px;cursor:pointer}.bp.sm:hover{background:#E0E0E0}
.bp.sm.cab-preset.on{background:#0067C5;color:#fff;border-color:#0053A5}
.bp.del{background:#C62828;padding:2px 8px;font-size:11px}.bp.del:hover{background:#B71C1C}
.iinfo{cursor:help;color:#0067C5;font-size:14px;position:relative;display:inline-flex;align-items:center}
.iinfo .tip{display:none;position:absolute;left:22px;top:-8px;background:#FFFFFF;border:1px solid #E0E0E0;padding:10px 14px;border-radius:8px;font-size:11px;color:#1C1C1C;white-space:normal;width:280px;z-index:100;box-shadow:0 4px 16px rgba(0,0,0,.1);line-height:1.5;font-weight:400}
.iinfo:hover .tip{display:block}
.adapt-wrap{overflow-x:auto;margin-top:8px}
table.adapt{width:100%;border-collapse:collapse;font-size:12px;min-width:420px}
table.adapt th,table.adapt td{padding:5px 6px;text-align:left;border-bottom:1px solid #E0E0E0;white-space:nowrap}
table.adapt th{color:#6F6F6F;font-weight:600;font-size:11px}
table.adapt select{padding:3px 5px;border:1px solid #D0D0D0;border-radius:4px;background:#FFFFFF;color:#1C1C1C;font-size:12px;max-width:100px}
table.adapt input[type=number]{width:48px;padding:3px 5px;border:1px solid #D0D0D0;border-radius:4px;background:#FFFFFF;color:#1C1C1C;font-size:12px;text-align:center}
table.adapt .at-desc{font-size:12px;color:#6F6F6F;max-width:160px;overflow:hidden;text-overflow:ellipsis}
/* ─── Simulator toolbar ─── */
.stb{display:flex;align-items:center;gap:4px;padding:6px 12px;background:#FFFFFF;border-bottom:1px solid #E0E0E0;flex-wrap:wrap}
.stb button{background:#F5F5F5;color:#1C1C1C;border:1px solid #D0D0D0;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px}
.stb button:hover{background:#E0E0E0}
.stb .vb{padding:5px 14px;font-size:12px;font-weight:600}
.stb .vb.on{background:#0067C5;color:#fff;border-color:#0067C5}
.stb .sep{width:1px;height:20px;background:#E0E0E0;margin:0 4px}
.stb .st{margin-left:auto;font-size:12px;color:#6F6F6F}
.cwrap{flex:1;overflow:auto;background:#FAFAFA;cursor:grab;position:relative}
#simsvg{display:block;user-select:none}
/* ─── Interactive port styles ─── */
.port-rect{cursor:pointer;transition:fill .12s,stroke .12s}
.port-rect:hover{stroke:#0067C5;stroke-width:2}
.port-rect.sel{stroke:#0E6027;stroke-width:2.5;filter:drop-shadow(0 0 4px #0E6027)}
.port-rect.compat{stroke:#0E6027;stroke-width:2;animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.cable-path{fill:none;stroke-width:2.5;stroke-linecap:round;cursor:pointer}
.cable-path:hover{stroke-width:4;filter:drop-shadow(0 0 4px rgba(0,0,0,.15))}
/* ─── Port tooltip ─── */
.ptip{position:absolute;background:#FFFFFF;border:1px solid #E0E0E0;border-radius:8px;padding:10px 14px;font-size:11px;color:#1C1C1C;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.1);pointer-events:auto;max-width:260px;line-height:1.6}
.ptip strong{color:#0067C5}
.ptip .ptip-title{font-weight:700;color:#1C1C1C;margin-bottom:4px;font-size:12px}
.ptip .ptip-row{display:flex;justify-content:space-between;gap:8px}
.ptip .ptip-close{position:absolute;top:4px;right:8px;cursor:pointer;color:#6F6F6F;font-size:14px}
/* ─── BOM panel ─── */
.bom-item{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid #E0E0E0}
.bom-item .bom-qty{color:#0E6027;font-weight:600;min-width:35px;text-align:right}
.bom-item .bom-qty.zero{color:#C62828}
.bom-cat{font-size:12px;color:#6F6F6F;font-weight:700;margin:10px 0 5px;text-transform:uppercase;letter-spacing:.5px}
/* Site requirements */
.srg{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:20px}
.src{background:#FFFFFF;border:1px solid #E0E0E0;border-radius:8px;padding:16px}
.src h3{font-size:16px;color:#1C1C1C;margin-bottom:10px}
.src.full{grid-column:1/-1}
.sn{font-size:12px;color:#858C95;margin-top:8px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:#F5F5F5}
::-webkit-scrollbar-thumb{background:#D0D0D0;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#B0B0B0}
@media(max-width:1100px){.sg{grid-template-columns:repeat(2,1fr)}.rg{grid-template-columns:repeat(2,1fr)}}
.hs input[type=range]{width:100%;accent-color:#0067C5;margin-top:2px}
.hs .rv{text-align:right;font-size:13px;font-weight:700;color:#0067C5;margin-top:2px}
@media(max-width:900px){.sg,.rg,.srg{grid-template-columns:1fr}#drawer{width:100%!important;max-width:100%!important;border-bottom:1px solid #E0E0E0}#resize-handle{display:none}}
</style>
</head>
<body>
<header class="hdr">
  <div class="hdr-main">

    <button type="button" id="btn-hw-save-draft" class="btn-hw-draft" aria-label="Save as draft and return to subscription sizing">Save as Draft</button>

  </div>

  {dist:'In-cabinet',speed:'200GbE',suggested:'1m',media:'QSFP56 DAC',lengths:['0.5m','1m','2m','3m']},

];

const CABLE_COLORS={

  'host 200gbe':'#5B21B6','fc 64g':'#C62828',storage:'#0097A7','shelf sas':'#0097A7',

  {role:'cluster',label:'Cluster (100GbE)',dash:''},
  {role:'isl',label:'ISL (customer-provided)',dash:'6,3'},

const CABINET_OPTIONS={

  rail_standard:['19-inch EIA'],

};
const CABINET_PRESETS={
  storage_heavy:{label:'Storage Heavy',owner:'netapp',height_u:42,width_mm:750,depth_mm:1200,door:'perforated_front_perforated_rear',side_panels:true,cable_entry:'top'},
  general_server_storage:{label:'General Server/Storage',owner:'netapp',height_u:42,width_mm:600,depth_mm:1070,door:'perforated_front_perforated_rear',side_panels:true,cable_entry:'top'},
  network_heavy:{label:'Network Heavy',owner:'netapp',height_u:42,width_mm:800,depth_mm:1000,door:'perforated_front_solid_rear',side_panels:true,cable_entry:'top'},
  customer_owned_standard:{label:'Customer-Owned Standard',owner:'customer',height_u:42,width_mm:600,depth_mm:1000,door:'perforated_front_perforated_rear',side_panels:true,cable_entry:'both'},
  customer_owned_deep:{label:'Customer-Owned Deep',owner:'customer',height_u:45,width_mm:750,depth_mm:1200,door:'perforated_front_perforated_rear',side_panels:true,cable_entry:'both'}
};
const COMPONENT_DEPTHS={
  A20:{depth_mm:880,note:'AFF A20 2U chassis'},A30:{depth_mm:880,note:'AFF A30 2U chassis'},
  A50:{depth_mm:880,note:'AFF A50 2U chassis'},A70:{depth_mm:1016,note:'AFF A70 4U chassis'},
  NS224:{depth_mm:596,note:'NS224 disk shelf'},'Cisco Nexus 3636C-R':{depth_mm:457,note:'Cluster switch'}
};
let cabConfig={height_u:42,width_mm:600,depth_mm:1070,door:'perforated_front_perforated_rear',
  side_panels:true,cable_entry:'top',preset:'general_server_storage',owner:'netapp'};

function checkCabinetCompatFor(cfg){
  const issues=[];
  const plat=hwCfg.platform;
  const sw=hwCfg.sw||{};
  const cdPlat=COMPONENT_DEPTHS[plat.id]||{depth_mm:880};
  if(cdPlat.depth_mm>cfg.depth_mm-100)
    issues.push({sev:'error',msg:`${plat.model} requires ~${cdPlat.depth_mm}mm depth + cable clearance. Cabinet depth ${cfg.depth_mm}mm may be too shallow.`});
  const cdShelf=COMPONENT_DEPTHS.NS224;
  if((hwCfg.totalShelves||0)>0&&cdShelf.depth_mm>cfg.depth_mm-100)
    issues.push({sev:'warning',msg:`NS224 shelf needs ${cdShelf.depth_mm}mm depth.`});
  if(sw.needSwitch){
    const cdSw=COMPONENT_DEPTHS['Cisco Nexus 3636C-R'];
    if(cdSw.depth_mm>cfg.depth_mm-100)
      issues.push({sev:'warning',msg:`Cisco 3636 switch needs ${cdSw.depth_mm}mm depth.`});
  }
  const _shelfRU=hwCfg.shelvesPerHaPair?hwCfg.shelvesPerHaPair.reduce((s,x)=>s+x*2,0):(hwCfg.totalShelves||0)*2;
  const usedRU=hwCfg.haPairs*plat.ctrl_ru*2+_shelfRU+2+(sw.switchRU||0)+1;
  if(usedRU>cfg.height_u)
    issues.push({sev:'error',msg:`${usedRU} RU needed but cabinet is ${cfg.height_u}U (${cfg.height_u-usedRU} short).`});
  else if(usedRU>cfg.height_u*0.85)
    issues.push({sev:'warning',msg:`${usedRU} of ${cfg.height_u}U used (${((usedRU/cfg.height_u)*100).toFixed(0)}%) — limited headroom for future expansion.`});
  if(cfg.width_mm<600)
    issues.push({sev:'error',msg:'Minimum 600mm width required for 19-inch EIA rail standard.'});
  if(cfg.door==='no_front_no_rear')
    issues.push({sev:'warning',msg:'Open-frame rack — airflow management limited. Ensure adequate cooling.'});
  if(!cfg.side_panels)
    issues.push({sev:'warning',msg:'No side panels — reduced EMI shielding and security.'});
  return issues;
}
function checkCabinetCompat(){
  return checkCabinetCompatFor(cabConfig);
}

function switchSizing(haPairs,topo,islLinksPerPair,sparePorts,switchOverride,distProfile){
  const totalNodes=haPairs*2;
  const switchRequired=totalNodes>2?'Required':(topo==='switched'?'Optional':'Not needed');
  const needSwitch=topo==='switched'||(totalNodes>2);
  const pairCount=needSwitch?1:0;
  const nodeToSwitchLinks=needSwitch?totalNodes*2:0;
  const islLinks=needSwitch?islLinksPerPair:0;
  const perSwNodePorts=needSwitch?Math.ceil(nodeToSwitchLinks/2):0;
  const perSwIslPorts=needSwitch?Math.ceil(islLinks/2):0;
  const perSwConsumed=perSwNodePorts+perSwIslPorts+sparePorts;
  const sw=(switchOverride&&switchOverride!=='auto')?SWITCH_OPTIONS.find(s=>s.id===switchOverride):SWITCH_OPTIONS[0];
  const usablePorts=sw.ports;
  const freePorts=usablePorts-perSwConsumed;
  const fitStatus=perSwConsumed<=usablePorts?'Fit':'Exceeds '+sw.name;
  const switchWatts=pairCount*2*sw.watts;
  const switchRU=pairCount*2*sw.ru;
  let topoLabel;
  if(totalNodes<=2&&!needSwitch) topoLabel='2-node switchless';
  else if(totalNodes<=2&&needSwitch) topoLabel='2-node switchless allowed; switched optional';
  else topoLabel='Switched cluster required ('+totalNodes+' nodes)';
  distProfile=distProfile||'In-cabinet';
  const cableRule=CABLE_RULES.find(r=>r.dist===distProfile&&r.speed==='100GbE');
  const sugLen=cableRule?cableRule.suggested:'1m';
  const sugMedia=cableRule?cableRule.media:'QSFP28 DAC';
  const swTransceivers=distProfile==='In-cabinet'?0:nodeToSwitchLinks+islLinks;
  const ctrlTransceivers=distProfile==='In-cabinet'?0:nodeToSwitchLinks;
  return{switchRequired,needSwitch,pairCount,totalNodes,nodeToSwitchLinks,islLinks,
    perSwNodePorts,perSwIslPorts,sparePorts,perSwConsumed,usablePorts,freePorts,fitStatus,
    switchWatts,switchRU,topoLabel,sw,sugLen,sugMedia,swTransceivers,ctrlTransceivers,
    totalSwitchCables:needSwitch?(nodeToSwitchLinks+islLinks):0};
}

/* ═══════════════════════════════════════════════════════════════
   SIZING ENGINE — Keystone Premium
   Formulas from JSON spec:
     usable_after_se = effective_capacity / se_ratio
     raw_required = usable_after_se / (1-overhead) * (1+growth)
     drives_needed = ceil(raw_required / drive_size_tb)
     HA pairs = max(ceil(raw_req / max_raw_per_ha_pair), ceil(host_ports / target_ports_per_ha))
   ═══════════════════════════════════════════════════════════════ */
function pickPlatform(rawTB, overridePlatId){
  if(overridePlatId && overridePlatId!=='auto'){
    const p=PLATFORMS.find(x=>x.id===overridePlatId);
    if(p) return p;
  }
  const rawPB=rawTB/1000;
  for(const p of PLATFORMS) if(rawPB<=p.max_raw_pb) return p;
  return PLATFORMS[PLATFORMS.length-1];
}
function sizingEngine(protocol,capTiB,seRatio,overheadPct,growthPct,driveTB,hostPorts,overridePlat,minHaPairs){
  const usableAfterSE=capTiB/seRatio;
  const rawTiB=usableAfterSE/(1-overheadPct)*(1+growthPct);
  const rawTB=rawTiB*1.09951;
  const drv=DRIVES.find(d=>d.tb===driveTB)||DRIVES[1];
  const rawDrives=Math.max(4,Math.ceil(rawTB/drv.tb));
  const plat=pickPlatform(rawTB, overridePlat);
  const maxRawTB=plat.max_raw_pb*1000;
  const capPairs=Math.max(1,Math.ceil(rawTB/maxRawTB));
  const portPairs=Math.max(1,Math.ceil(hostPorts/plat.host_ports_per_ha));
  const instancePairs=minHaPairs||1;
  const haPairs=Math.max(capPairs,portPairs,instancePairs);
  const totalInternal=plat.int_drives*haPairs;
  let int,ext,sh,tot;
  if(rawDrives<=totalInternal){int=totalInternal;ext=0;sh=0;}
  else{int=totalInternal;sh=Math.ceil((rawDrives-totalInternal)/24);ext=sh*24;}
  tot=int+ext;
  const isSan=protocol==='san';
  const maxHA=isSan?plat.max_ha.san:plat.max_ha.nas;
  const scaleOk=haPairs<=maxHA;
  return{protocol,perfLevel:'Premium',committed_tib:capTiB,usable_after_se:usableAfterSE,
    se_ratio:seRatio,overheadPct,growthPct,tib_to_tb_factor:1.09951,raw_tib:rawTiB,raw_tb:rawTB,
    driveSize:driveTB,rawDrives,totalDrives:tot,internalDrives:int,externalDrives:ext,shelves:sh,
    haPairs,capPairs,portPairs,instancePairs,hostPorts,platform:plat,scaleOk,maxHA,
    measurementType:seRatio>1?'logical':'physical'};
}

function checkCableWarnings(){
  const warnings=[];
  const cableLen=q('h-cable')?q('h-cable').value:'1m';
  const lenM=parseFloat(cableLen)||1;
  const cabItems={};
  for(const it of rackItems){
    if(!cabItems[it.type])cabItems[it.type]=[];
    cabItems[it.type].push(it);
  }
  // controllers in different cabinets from their shelves
  for(const it of rackItems){
    if(it.type!=='shelf')continue;
    const ctrls=rackItems.filter(r=>r.type==='controller'&&r.ha===it.ha);
    for(const ct of ctrls){
      if(ct.cabIdx!==it.cabIdx){
        const dist=Math.abs(ct.cabIdx-it.cabIdx);
        const estLen=dist*1.5;
        if(estLen>lenM){
          warnings.push({sev:'error',msg:`${it.label} in Cabinet ${it.cabIdx+1} needs >${estLen.toFixed(1)}m cable to reach ${ct.label} in Cabinet ${ct.cabIdx+1}. Selected cable: ${cableLen}`});
        }else{
          warnings.push({sev:'warning',msg:`${it.label} and ${ct.label} in adjacent cabinets — verify ${cableLen} cable reaches.`});
        }
      }
    }
  }
  // cluster switches should be in same cabinet or adjacent
  const clSw=rackItems.filter(r=>r.type==='cluster-switch');
  const controllers=rackItems.filter(r=>r.type==='controller');
  for(const sw of clSw){
    for(const ct of controllers){
      if(Math.abs(sw.cabIdx-ct.cabIdx)>1){
        warnings.push({sev:'error',msg:`${sw.label} (Cab ${sw.cabIdx+1}) is ${Math.abs(sw.cabIdx-ct.cabIdx)} cabinets away from ${ct.label} (Cab ${ct.cabIdx+1}). Cluster cables may not reach.`});
      }
    }
  }
  return warnings;
}

function updateConfigStatus(){
  const issues=[];
  if(!lastSizing) issues.push('No sizing calculated');
  if(rackItems.length===0) issues.push('No rack items placed');
  const cabU=cabConfig.height_u||42;
  for(let ci=0;ci<numCabs;ci++){
    const items=rackItems.filter(r=>r.cabIdx===ci);
    const usedU=items.reduce((s,r)=>s+r.ru,0);
    if(usedU>cabU) issues.push(`Cabinet ${ci+1}: ${usedU}U used exceeds ${cabU}U capacity`);
  }
  const cableWarns=checkCableWarnings().filter(w=>w.sev==='error');
  if(cableWarns.length) issues.push(`${cableWarns.length} cable length error(s)`);
  hwConfigComplete=issues.length===0&&rackItems.length>0;
  const el=q('config-status');
  if(el){
    if(hwConfigComplete){
      el.innerHTML='<span style="color:#0E6027;font-weight:600">✓ Configuration Complete</span>';
      el.style.background='#ECFDF5';el.style.borderColor='#A7F3D0';

      el.style.background='#FEF2F2';el.style.borderColor='#FECACA';
    }
  }
  // notify parent
  if(window.parent&&window.parent!==window){

}

function updateCableLengths(){
  const dist=q('s-dist')?q('s-dist').value:'In-cabinet';
  const feSpeed=q('s-fespeed')?q('s-fespeed').value:'25GbE';
  const rows=[...document.querySelectorAll('#adapt-body tr')];
  for(const row of rows){
    const tp=row.querySelector('.at-type')?.value;
    const cat=ADAPTER_CATALOG[tp];
    const spd=(cat&&cat.mode!=='SAS'&&cat.mode!=='64G FC')?cat.mode:feSpeed;
    const lenSel=row.querySelector('.at-clen');
    if(!lenSel)continue;
    const prev=lenSel.value;
    const lens=getCableLengths(dist,spd);
    const selected=lens.includes(prev)?prev:(lens[0]||'');
    lenSel.innerHTML=lens.map(l=>`<option value="${l}"${l===selected?' selected':''}>${l}</option>`).join('');
  }
  const mainLen=q('h-cable');
  if(mainLen){
    const lens=getCableLengths(dist,feSpeed);
    const prev=mainLen.value;
    const selected=lens.includes(prev)?prev:(lens[0]||'');
    mainLen.innerHTML=lens.map(l=>`<option value="${l}"${l===selected?' selected':''}>${l}</option>`).join('');
  }
}

/* ═══════════════════════════════════════════════════════════════
   POWER ESTIMATE
   ═══════════════════════════════════════════════════════════════ */
function estimatePower(r){
  const p=r.platform;
  const driveW=r.totalDrives*p.pwr.drive;
  const shelfW=r.shelves*p.pwr.shelf;
  const adapterW=r.haPairs*2*50;
  const baseW=r.haPairs*p.pwr.base;
  const totalW=baseW+driveW+shelfW+adapterW;
  const psus=Math.ceil(totalW/1600)*2;
  return{baseW,driveW,shelfW,adapterW,totalW,psus};
}

/* ═══════════════════════════════════════════════════════════════
   MASTER RECALCULATION
   ═══════════════════════════════════════════════════════════════ */
function globalCalc(){
  const protocol=q('s-proto')?q('s-proto').value:'unified';
  const cap=+q('s-cap').value;
  if(q('s-cap-num')&&+q('s-cap-num').value!==cap) q('s-cap-num').value=cap;
  const se=+q('s-se').value;
  const drv=+q('s-drv').value;
  const overhead=+(q('s-overhead')?q('s-overhead').value:0.20);
  const growth=+(q('s-growth')?q('s-growth').value:0.15);
  const hostPorts=+(q('s-hports')?q('s-hports').value:8);
  const overridePlat=q('s-oplat')?q('s-oplat').value:'auto';
  const r=sizingEngine(protocol,cap,se,overhead,growth,drv,hostPorts,overridePlat,1);
  lastSizing=r;
  if(instanceConfigs[currentInstanceIdx]){
    instanceConfigs[currentInstanceIdx].capacityTiB=r.committed_tib;
    instanceConfigs[currentInstanceIdx].protocol=r.protocol;
  }

  const instanceRuns=instanceConfigs.map((ic,idx)=>{
    if(idx===currentInstanceIdx) return r;
    return sizingEngine(ic.protocol||'unified',ic.capacityTiB||100,se,overhead,growth,drv,hostPorts,overridePlat,1);
  });
  // Build per-HA-pair shelf counts: each HA pair only gets shelves if its instance needs them
  const _shelvesPerHaPair=[];
  instanceRuns.forEach(ir=>{
    const pairs=Math.max(1,ir.haPairs||1);
    const shPerPair=Math.ceil((ir.shelves||0)/pairs);
    for(let i=0;i<pairs;i++) _shelvesPerHaPair.push(shPerPair);
  });
  const agg={
    haPairs:instanceRuns.reduce((s,x)=>s+(x.haPairs||0),0),
    totalDrives:instanceRuns.reduce((s,x)=>s+(x.totalDrives||0),0),
    shelves:instanceRuns.reduce((s,x)=>s+(x.shelves||0),0),
    rawTB:instanceRuns.reduce((s,x)=>s+(x.raw_tb||0),0),
    committedTiB:instanceRuns.reduce((s,x)=>s+(x.committed_tib||0),0),
    internalDrives:instanceRuns.reduce((s,x)=>s+(x.internalDrives||0),0),
    externalDrives:instanceRuns.reduce((s,x)=>s+(x.externalDrives||0),0),
    shelvesPerHA:Math.max(0,...instanceRuns.map(x=>Math.ceil((x.shelves||0)/Math.max(1,x.haPairs||1)))),
    shelvesPerHaPair:_shelvesPerHaPair
  };
  const simHaPairs=Math.max(1,agg.haPairs||r.haPairs||1);
  haPairLabels=buildHaPairLabels(instanceRuns);
  while(haPairLabels.length<simHaPairs) haPairLabels.push(`HA${haPairLabels.length+1}`);

  if(simHaPairs>1&&q('h-topo')&&q('h-topo').value==='switchless') q('h-topo').value='switched';
  if(simHaPairs===1&&q('h-topo')&&q('h-topo').value==='switched') q('h-topo').value='switchless';
  const topo=q('h-topo')?q('h-topo').value:'switched';
  console.log('[HW-CFG] Topology:',{instances:instanceConfigs.length,caps:instanceConfigs.map(ic=>ic.capacityTiB),simHaPairs,topo});
  const islLinks=+(q('s-isl')?q('s-isl').value:4);
  const sparePorts=+(q('s-spare')?q('s-spare').value:4);
  const swOverride=q('s-swopt')?q('s-swopt').value:'auto';
  const swDist=q('s-swdist')?q('s-swdist').value:'In-cabinet';
  const sw=switchSizing(simHaPairs,topo,islLinks,sparePorts,swOverride,swDist);
  r.sw=sw;

  hwCfg={platform:r.platform,haPairs:simHaPairs,shelvesPerHA:agg.shelvesPerHA,
    shelvesPerHaPair:agg.shelvesPerHaPair,totalShelves:agg.shelves,drivesPerShelf:24,
    totalDrives:agg.totalDrives,addSwitch:sw.needSwitch,
    internalDrives:agg.internalDrives,externalDrives:agg.externalDrives,sw};

  if(q('h-plat'))q('h-plat').value=r.platform.model;
  if(q('h-ha'))q('h-ha').value=simHaPairs;
  if(q('h-shelves'))q('h-shelves').value=agg.shelves;
  if(q('h-tdrv'))q('h-tdrv').value=agg.totalDrives+' ('+agg.internalDrives+' int + '+agg.externalDrives+' ext)';
  if(q('h-pcie'))q('h-pcie').textContent=r.platform.pcie+' slots (per controller)';
  const switchRU=sw.switchRU||0;
  const totalShelfRU=agg.shelvesPerHaPair?agg.shelvesPerHaPair.reduce((s,x)=>s+x*2,0):agg.shelves*2;
  numCabs=Math.max(1,Math.ceil((simHaPairs*r.platform.ctrl_ru*2+totalShelfRU+switchRU+2)/cabConfig.height_u));
  if(q('h-cabs'))q('h-cabs').value=numCabs;
  if(q('h-sw-status')){
    q('h-sw-status').textContent=sw.needSwitch?`Yes — ${sw.sw.name}`:'No (switchless)';
    q('h-sw-status').style.color=sw.needSwitch?'#0067C5':'#0E6027';
  }

  if(instanceConfigs.length>1){
    if(q('qc-cap')) q('qc-cap').textContent=r.committed_tib+' TiB (this instance)';
    if(q('qc-inst')) q('qc-inst').textContent=instanceConfigs.length+' instances ('+simHaPairs+' HA)';
    if(q('qc-agg')) q('qc-agg').innerHTML='<strong>All instances total:</strong> '+agg.committedTiB+' TiB effective &middot; '+agg.haPairs+' HA pairs &middot; '+agg.totalDrives+' drives';
  }else{
    if(q('qc-cap')) q('qc-cap').textContent=r.committed_tib+' TiB';
    if(q('qc-inst')) q('qc-inst').textContent='1 ('+simHaPairs+' HA)';
    if(q('qc-agg')) q('qc-agg').textContent='';
  }

  const nextHwSig=JSON.stringify({
    plat:r.platform.id,ha:simHaPairs,shPerHA:agg.shelvesPerHaPair,drv:agg.totalDrives,swNeed:sw.needSwitch,swRu:sw.switchRU
  });
  const hardwareChanged=nextHwSig!==_lastHwSig;
  _lastHwSig=nextHwSig;

  updateDriveOptions(r.platform);
  updateCableLengths();
  renderResults(r);
  syncBackToParent(r,instanceRuns,agg);
  if(window._renderCabCompat) window._renderCabCompat();
  console.log('[SHELF DEBUG]',{
    instances:instanceConfigs.length,
    currentIdx:currentInstanceIdx,
    perInstance:instanceRuns.map((ir,i)=>({idx:i,cap:ir.committed_tib,shelves:ir.shelves,haPairs:ir.haPairs,rawDrives:ir.rawDrives,intDrives:ir.internalDrives})),
    aggShelves:agg.shelves,
    shelvesPerHA:agg.shelvesPerHA,
    shelvesPerHaPair:agg.shelvesPerHaPair,
    hwChanged:hardwareChanged
  });
  if(hardwareChanged){
    cableConns=[];
    rackItems=buildDefaultRackItems();
    console.log('[SHELF DEBUG] rackItems shelves:',rackItems.filter(r=>r.type==='shelf').map(r=>({id:r.id,ha:r.ha})));
  }
  renderSim();
  updateSite();
}

function updateDriveOptions(plat){
  const sel=q('s-drv'); if(!sel)return;
  const prev=+sel.value;
  const drvPNs={15.3:'X4032B',30.7:'X4030A',61.4:'X4154A'};
  sel.innerHTML=plat.drives.map(d=>`<option value="${d}"${d===prev?' selected':''}>${d} TB — ${drvPNs[d]||''}</option>`).join('');
  if(!plat.drives.includes(prev)) sel.value=plat.drives[0];
}

/* ═══════════════════════════════════════════════════════════════
   RACK DRAG-AND-DROP HANDLERS
   ═══════════════════════════════════════════════════════════════ */
let rackDragGhost=null, rackDragMarker=null;

function getGroupRU(it){
  if(!it.group) return it.ru;
  return rackItems.filter(o=>o.group===it.group).reduce((s,o)=>s+o.ru,0);
}
function handleRackDragMove(e,svg,pz){
  if(!rackDrag)return;
  const r=svg.getBoundingClientRect();
  const mx=(e.clientX-r.left-pz.x)/pz.s;
  const my=(e.clientY-r.top-pz.y)/pz.s;
  const it=rackItems[rackDrag.idx]; if(!it)return;
  const cabU=cabConfig.height_u||42;
  const groupRU=getGroupRU(it);

  // Remove old ghost / marker
  if(rackDragGhost){rackDragGhost.remove();rackDragGhost=null;}
  if(rackDragMarker){rackDragMarker.remove();rackDragMarker=null;}

  // Find which cabinet mouse is over
  let targetCab=-1;
  for(let i=0;i<rackCabs.length;i++){
    const cab=rackCabs[i];
    if(mx>=cab.x&&mx<=cab.x+cab.w&&my>=cab.y&&my<=cab.y+cab.h){targetCab=i;break;}
  }
  if(targetCab<0)return;

  const cab=rackCabs[targetCab];
  const uH=cab.uH;
  // snap to nearest RU — use group size for placement
  const relY=my-cab.iy;
  const uFromTop=Math.floor(relY/uH);
  const snapU=cabU-uFromTop-groupRU;
  const clampedU=Math.max(0,Math.min(cabU-groupRU,snapU));
  const snapY=cab.iy+cab.ih-(clampedU+groupRU)*uH;

  // ghost rectangle — full group height
  rackDragGhost=sRect(svg,{x:cab.ix+2,y:snapY,width:cab.iw-4,height:groupRU*uH-2,rx:2,fill:it.stroke,opacity:0.3,stroke:it.stroke,'stroke-width':2,'stroke-dasharray':'4,2',class:'rack-ghost'});

  // RU marker line — full group
  rackDragMarker=sGrp(svg,{class:'rack-marker'});
  const markerY=snapY+groupRU*uH;
  sLine(rackDragMarker,cab.ix-14,snapY,cab.ix+cab.iw+14,snapY,'#fbbf24',1.5,'3,2');
  sLine(rackDragMarker,cab.ix-14,markerY,cab.ix+cab.iw+14,markerY,'#fbbf24',1.5,'3,2');
  sRect(rackDragMarker,{x:cab.ix+cab.iw+2,y:snapY,width:28,height:groupRU*uH,rx:3,fill:'#fbbf24'});
  sText(rackDragMarker,cab.ix+cab.iw+16,snapY+groupRU*uH/2+4,`U${clampedU+1}–${clampedU+groupRU}`,{fill:'#1a1a1a','font-size':'8px','text-anchor':'middle','font-weight':'700'});

  // check overlap — exclude group members from collision test
  const groupIds=it.group?rackItems.map((o,oi)=>o.group===it.group?oi:-1).filter(i=>i>=0):[];
  const overlap=rackItems.some((other,oi)=>{
    if(oi===rackDrag.idx||groupIds.includes(oi)||other.cabIdx!==targetCab)return false;
    return clampedU<other.startU+other.ru&&clampedU+groupRU>other.startU;
  });
  if(overlap){
    rackDragGhost.setAttribute('stroke','#fc8181');
    rackDragGhost.setAttribute('fill','#7f1d1d');
  }

  rackDrag._targetCab=targetCab;
  rackDrag._targetU=clampedU;
  rackDrag._overlap=overlap;
}

function handleRackDragEnd(e,svg,pz){
  if(!rackDrag)return;
  const it=rackItems[rackDrag.idx];
  const moved=it&&rackDrag._targetCab>=0&&!rackDrag._overlap&&
    (it.cabIdx!==rackDrag._targetCab||it.startU!==rackDrag._targetU);
  if(moved){
    const baseU=rackDrag._targetU;
    const targetCab=rackDrag._targetCab;
    if(it.group){
      const members=rackItems.filter(o=>o.group===it.group).sort((a,b)=>(b.groupRole==='top'?1:0)-(a.groupRole==='top'?1:0));
      let uPos=baseU;
      for(const m of members){m.cabIdx=targetCab;m.startU=uPos;uPos+=m.ru;}
    }else{
      it.cabIdx=targetCab;
      it.startU=baseU;
    }
    _rackLayoutVersion++;
  }
  if(rackDragGhost){rackDragGhost.remove();rackDragGhost=null;}
  if(rackDragMarker){rackDragMarker.remove();rackDragMarker=null;}
  rackDrag=null;
  svg.style.cursor='';
  updateCableWarnings();
  renderSim();
  if(moved) notifyRackLayoutChanged();
}

function notifyRackLayoutChanged(){
  const st=q('sim-st');
  if(st){
    const warns=checkCableWarnings();
    const warnCount=warns.filter(w=>w.sev==='error').length;
    st.innerHTML=warnCount>0
      ?`<span style="color:#C62828">⚠ ${warnCount} cable warning(s) — lengths may need adjustment after rack move</span>`
      :`RACK | Layout updated — cable lengths recalculated`;
  }
}

function updateCableWarnings(){
  const warns=checkCableWarnings();
  if(warns.length){
    const el=q('sim-st');
    if(el) el.title=warns.map(w=>w.msg).join('\n');
  }
}

function ensureDefaultAdapterRows(){
  const tbody=q('adapt-body');

  const proto=q('s-proto')?q('s-proto').value:'unified';
  const hostType=proto==='san'?'FC 64G':'Host 25GbE';
  const defaults=['Cluster',hostType,'Shelf SAS'];
  defaults.forEach(tp=>{
    addAdapterRow();
    const row=tbody.lastElementChild;
    const sel=row?row.querySelector('.at-type'):null;
    if(sel){
      sel.value=tp;
      onAdaptType(sel);
    }
  });
}
function onAdaptType(sel){
  const row=sel.closest('tr'),tp=sel.value,cat=ADAPTER_CATALOG[tp];
  if(cat){
    row.querySelector('.at-desc').textContent=cat.desc;
    row.querySelector('.at-mode').textContent=cat.mode;
    row.querySelector('.at-qty').value=cat.defQty;
    if(cat.media==='FC'){
      row.querySelector('.at-cable').value='Fiber';
      row.querySelector('.at-sfp').checked=true;row.querySelector('.at-sfp').disabled=false;
    }

    row.querySelector('.at-mode').textContent='—';
    row.querySelector('.at-qty').value=0;
  }

function onCableType(sel){

}

  const pwrEl=q('pwr-panel');

  <table class="t"><tr><th>Component</th><th>Watts</th></tr>

/* ═══════════════════════════════════════════════════════════════
   SVG HELPERS
   ═══════════════════════════════════════════════════════════════ */
function sEl(tag,attrs,parent){
  const e=document.createElementNS(NS,tag);
  if(attrs)for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);
  if(parent)parent.appendChild(e); return e;
}
function sRect(p,a){return sEl('rect',a,p);}
function sText(p,x,y,t,a={}){const e=sEl('text',{x,y,...a},p);e.textContent=t;return e;}
function sLine(p,x1,y1,x2,y2,s,sw,da){const a={x1,y1,x2,y2,stroke:s,'stroke-width':sw};if(da)a['stroke-dasharray']=da;return sEl('line',a,p);}
function sPath(p,d,s,sw,cls){const a={d,stroke:s,'stroke-width':sw,fill:'none'};if(cls)a['class']=cls;return sEl('path',a,p);}
function sGrp(p,a){return sEl('g',a,p);}

/* ═══════════════════════════════════════════════════════════════
   SVG SIMULATOR — MAIN DISPATCH
   ═══════════════════════════════════════════════════════════════ */
function renderSim(){
  const svg=q('simsvg'); if(!svg)return;
  hideCableTip();
  svg.innerHTML=''; portElMap={};
  if(!rackItems.length) rackItems=buildDefaultRackItems();
  const m=buildPhysicalModel();
  addDefs(svg);
  if(simView==='front') renderFront(svg,m);
  else if(simView==='back') renderBack(svg,m);
  else if(simView==='cabling') renderCabling(svg,m);
  else renderRack(svg,m);
  if(simView==='cabling'||simView==='back') drawExistingCables(svg);
  if(q('sim-st'))q('sim-st').textContent=`${simView.toUpperCase()} | ${hwCfg.haPairs} HA, ${m.drives.filter(d=>d.populated).length} drives, ${m.pcie} slots/ctrl`;
  updateConfigStatus();
}

function addDefs(svg){
  const d=sEl('defs',null,svg);
  d.innerHTML=`<linearGradient id="gC" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F5F5F5"/><stop offset="100%" stop-color="#E8E8E8"/></linearGradient>
    <linearGradient id="gCh" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E8F1FC"/><stop offset="100%" stop-color="#D6E6F9"/></linearGradient>
    <linearGradient id="gSh" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFF8E1"/><stop offset="100%" stop-color="#FFF0C0"/></linearGradient>
    <linearGradient id="gP" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#38a169"/><stop offset="100%" stop-color="#276749"/></linearGradient>
    <filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.08"/></filter>`;
}

function drawCabInfoBar(svg,W,pad){
  const showCab=q('h-cabreq')&&q('h-cabreq').value==='yes';
  if(!showCab)return 0;
  const g=sGrp(svg,{transform:`translate(${pad},6)`});
  const bw=W-pad*2;
  sRect(g,{x:0,y:0,width:bw,height:26,rx:6,fill:'#FFFFFF',stroke:'#E0E0E0','stroke-width':1});
  sText(g,8,17,`Cabinet: ${cabConfig.height_u}U · ${cabConfig.width_mm}×${cabConfig.depth_mm}mm · ${numCabs} cab(s) · ${cabConfig.door.replace(/_/g,' ')} · Cable: ${cabConfig.cable_entry}`,
    {fill:'#4A4A4A','font-size':'11px'});
  return 32;
}

/* ── FRONT VIEW ── */
function renderFront(svg,m){
  const W=700, pad=40;
  let Y=pad+drawCabInfoBar(svg,W,pad);
  for(let ha=0;ha<hwCfg.haPairs;ha++){
    const g=sGrp(svg,{transform:`translate(${pad},${Y})`});
    Y+=drawChassisFront(g,m,ha,W-pad*2);
    Y+=10;
    const haSh=(m.shelvesPerHaPair&&m.shelvesPerHaPair[ha]!==undefined)?m.shelvesPerHaPair[ha]:m.shelves;
    for(let s=0;s<haSh;s++){
      const sg=sGrp(svg,{transform:`translate(${pad},${Y})`});
      Y+=drawShelfFront(sg,s,W-pad*2);
      Y+=10;
    }
    Y+=20;
  }
  svg.setAttribute('viewBox',`0 0 ${W} ${Y+pad}`);
  svg.style.width=W+'px'; svg.style.height=(Y+pad)+'px';
}

function drawChassisFront(g,m,ha,W){
  const H=m.ru===4?180:110, cols=12, rows=Math.ceil(m.drives.length/cols);
  // Chassis frame
  sRect(g,{x:0,y:0,width:W,height:H,rx:4,fill:'url(#gC)',stroke:'#4299e1','stroke-width':2,filter:'url(#sh)'});
  // Title bar
  sRect(g,{x:0,y:0,width:W,height:22,rx:4,fill:'#4299e1',opacity:0.85});
  sText(g,W/2,15,`${m.platform} — ${getHaLabel(ha)} — FRONT`,{fill:'#fff','font-size':'13px','text-anchor':'middle','font-weight':'700'});
  // PSU indicators
  sRect(g,{x:6,y:28,width:18,height:H-36,rx:2,fill:'url(#gP)',stroke:'#276749','stroke-width':0.5});
  sText(g,15,H/2+4,'PSU',{fill:'#fff','font-size':'9px','text-anchor':'middle',transform:`rotate(-90,15,${H/2+4})`});
  sRect(g,{x:W-24,y:28,width:18,height:H-36,rx:2,fill:'url(#gP)',stroke:'#276749','stroke-width':0.5});
  // Drive bays
  const bayArea={x:32,y:28,w:W-64,h:H-36};
  const bw=Math.min(46,Math.floor((bayArea.w-4)/cols)-2), bh=Math.min(30,Math.floor((bayArea.h-4)/rows)-2);
  for(let i=0;i<m.drives.length;i++){
    const col=i%cols, row=Math.floor(i/cols);
    const bx=bayArea.x+4+col*(bw+2), by=bayArea.y+4+row*(bh+2);
    const pop=m.drives[i].populated;
    sRect(g,{x:bx,y:by,width:bw,height:bh,rx:2,fill:pop?'#2d3748':'#0d1117',stroke:pop?'#4a5568':'#1a202c','stroke-width':0.8});
    if(pop){
      sRect(g,{x:bx+2,y:by+2,width:bw-4,height:6,rx:1,fill:'#48bb78',opacity:0.7});
      sText(g,bx+bw/2,by+bh-4,m.drives[i].bay,{fill:'#718096','font-size':'9px','text-anchor':'middle'});
    }else{
      sText(g,bx+bw/2,by+bh/2+3,'—',{fill:'#2d3748','font-size':'9px','text-anchor':'middle'});
    }
  }
  // LED strip
  for(let i=0;i<4;i++) sRect(g,{x:W-20,y:30+i*10,width:6,height:6,rx:1,fill:i<2?'#48bb78':'#f6ad55'});
  return H;
}

function drawShelfFront(g,idx,W){
  const H=70;
  sRect(g,{x:0,y:0,width:W,height:H,rx:4,fill:'url(#gSh)',stroke:'#d69e2e','stroke-width':2,filter:'url(#sh)'});
  sRect(g,{x:0,y:0,width:W,height:20,rx:4,fill:'#d69e2e',opacity:0.85});

function drawChassisBack(g,m,ha,W){
  const ctrlH=60, gap=4, H=ctrlH*2+gap+40;
  sRect(g,{x:0,y:0,width:W,height:H,rx:4,fill:'url(#gC)',stroke:'#4299e1','stroke-width':2,filter:'url(#sh)'});
  sRect(g,{x:0,y:0,width:W,height:22,rx:4,fill:'#4299e1',opacity:0.85});
  sText(g,W/2,15,`${m.platform} — ${getHaLabel(ha)} — REAR`,{fill:'#fff','font-size':'13px','text-anchor':'middle','font-weight':'700'});
  for(let ci=0;ci<2;ci++){
    const ctrl=m.controllers[ci], cy=26+ci*(ctrlH+gap);
    const cg=sGrp(g,{transform:`translate(6,${cy})`});
    const cw=W-12;
    sRect(cg,{x:0,y:0,width:cw,height:ctrlH,rx:3,fill:'#1a202c',stroke:'#2d3748','stroke-width':1});
    sText(cg,4,12,`Controller ${ctrl.id}`,{fill:'#a0aec0','font-size':'11px','font-weight':'700'});
    // Mgmt port
    const mp=makePort(cg,8,18,20,16,{id:`ha${ha}-${ctrl.id}-mgmt`,media:'RJ45',speed:'1GbE',role:'management',ctrl:ctrl.id,slot:'mgmt',port:0,ha});
    sText(cg,18,48,'Mgmt',{fill:'#718096','font-size':'9px','text-anchor':'middle'});
    // IO slots
    const slotW=Math.min(110,Math.floor((cw-120)/m.pcie));
    for(let si=0;si<m.pcie;si++){
      const sx=40+si*(slotW+4), mod=ctrl.slots[si];
      sRect(cg,{x:sx,y:16,width:slotW,height:38,rx:2,fill:mod?'#2d3748':'#0d1117',stroke:mod?'#4a5568':'#1a202c','stroke-width':0.8});
      sText(cg,sx+slotW/2,14,`Slot ${si+1}`,{fill:'#718096','font-size':'9px','text-anchor':'middle'});
      if(mod){
        const pCount=mod.portCount||2, pw=Math.min(22,Math.floor((slotW-8)/pCount)-2);
        for(let pi=0;pi<pCount;pi++){
          const px=sx+4+pi*(pw+2);
          const pId=`ha${ha}-${ctrl.id}-s${si+1}-p${pi+1}`;
          makePort(cg,px,20,pw,14,{id:pId,media:mod.media,speed:mod.speed,role:mod.role,ctrl:ctrl.id,slot:si+1,port:pi+1,ha,pn:mod.pn});
          sText(cg,px+pw/2,48,`p${pi+1}`,{fill:'#718096','font-size':'8px','text-anchor':'middle'});
        }
        sText(cg,sx+slotW/2,42,mod.speed,{fill:ROLE_CLR[mod.role]||'#8b949e','font-size':'9px','text-anchor':'middle','font-weight':'600'});
      }else{
        sText(cg,sx+slotW/2,38,'empty',{fill:'#2d3748','font-size':'8px','text-anchor':'middle'});
      }
    }
    // PSU
    const psuX=cw-46;
    sRect(cg,{x:psuX,y:4,width:40,height:ctrlH-8,rx:2,fill:'url(#gP)',stroke:'#276749','stroke-width':0.5});
    sText(cg,psuX+20,ctrlH/2+2,`PSU ${m.psus[ci].id}`,{fill:'#fff','font-size':'10px','text-anchor':'middle','font-weight':'600'});
    sText(cg,psuX+20,ctrlH/2+12,m.psus[ci].rating,{fill:'#c6f6d5','font-size':'8px','text-anchor':'middle'});
  }
  return H;
}

function drawShelfBack(g,idx,W,ha){
  const H=50;
  sRect(g,{x:0,y:0,width:W,height:H,rx:4,fill:'url(#gSh)',stroke:'#d69e2e','stroke-width':2,filter:'url(#sh)'});
  sRect(g,{x:0,y:0,width:W,height:18,rx:4,fill:'#d69e2e',opacity:0.85});

  // IOM A & B (each has 2 ports)
  for(let iom=0;iom<2;iom++){
    const ix=40+iom*(W/2-20);

    sText(g,ix+2,32,`IOM ${iom?'B':'A'}`,{fill:'#a0aec0','font-size':'10px'});
    for(let p=0;p<2;p++){
      makePort(g,ix+50+p*24,24,20,16,{id:`ha${ha}-sh${idx+1}-iom${iom?'B':'A'}-p${p+1}`,media:'QSFP28',speed:'100GbE',role:'storage',ctrl:iom?'B':'A',slot:'shelf',port:p+1,ha});
    }

}

function makePort(parent,x,y,w,h,data){
  const r=sRect(parent,{x,y,width:w,height:h,rx:2,fill:ROLE_CLR[data.role]||'#4a5568',stroke:'#222','stroke-width':0.6,class:'port-rect','data-port':JSON.stringify(data),cursor:'pointer',opacity:0.85});
  // Store in registry for cable drawing
  portElMap[data.id]={el:r,data,cx:0,cy:0}; // cx/cy computed at draw time
  r.addEventListener('mousedown',e=>{e.stopPropagation();onPortMouseDown(e,data,r);});
  r.addEventListener('mouseenter',e=>showPortTip(e,data));
  r.addEventListener('mouseleave',()=>{if(!selPort)hideTip();});
  return r;
}

/* ── CABLING VIEW — top-of-rack switches + equipment below ── */
function renderCabling(svg,m){
  const W=1100, pad=40, equipW=660;
  let Y=pad+drawCabInfoBar(svg,W,pad);
  const topo=q('h-topo')?q('h-topo').value:'switched';
  const feSpeed=q('s-fespeed')?q('s-fespeed').value:'25GbE';
  const equipAnchors=[];

  // ─── OVERHEAD MANAGEMENT RJ45 PATCH PANEL ───
  const swMgmtCount=2+((hwCfg.sw&&hwCfg.sw.needSwitch)?2:0);
  const mgmtCount=Math.max(1,hwCfg.haPairs*2+swMgmtCount);
  const mgmtPanelH=34;
  const mgmtG=sGrp(svg,{transform:`translate(${pad},${Y})`});
  sRect(mgmtG,{x:0,y:0,width:equipW,height:mgmtPanelH,rx:4,fill:'#111827',stroke:'#4b5563','stroke-width':1,filter:'url(#sh)'});
  sText(mgmtG,equipW/2,12,'Overhead Management Patch Panel (RJ45 drops)',{fill:'#cbd5e1','font-size':'12px','text-anchor':'middle','font-weight':'700'});
  const mpw=Math.max(10,Math.min(20,Math.floor((equipW-24)/mgmtCount)-2));
  for(let i=0;i<mgmtCount;i++){
    const px=12+i*(mpw+2);
    makePort(mgmtG,px,16,mpw,12,{id:`overhead-mgmt-p${i+1}`,media:'RJ45',speed:'1GbE',role:'management',ctrl:'patch',slot:'overhead',port:i+1,ha:-1});
    sText(mgmtG,px+mpw/2,31,`${i+1}`,{fill:'#9ca3af','font-size':'8px','text-anchor':'middle'});
  }
  Y+=mgmtPanelH+8;

  // ─── EQUIPMENT LAYOUT — ordered by rack position per cabinet ─── */
  const sw=hwCfg.sw||{};
  const pduW=28;
  const leftPduX=pad-36;
  const rightPduX=pad+equipW+8;

  const swPorts=sw.sw?sw.sw.ports:36;
  const switchDefMap={
    'cust-sw-a':{name:'Customer Switch A',media:feSpeed==='100GbE'?'QSFP28':'SFP28',speed:feSpeed,role:'network',ports:24,color:'#0067C5'},
    'cust-sw-b':{name:'Customer Switch B',media:feSpeed==='100GbE'?'QSFP28':'SFP28',speed:feSpeed,role:'network',ports:24,color:'#0067C5'},
    'cl-sw-a':{name:'Cisco 3636 Cluster A',media:'QSFP28',speed:'100GbE',role:'cluster',ports:swPorts,color:'#805ad5',consumed:sw.perSwConsumed,free:sw.freePorts},
    'cl-sw-b':{name:'Cisco 3636 Cluster B',media:'QSFP28',speed:'100GbE',role:'cluster',ports:swPorts,color:'#805ad5',consumed:sw.perSwConsumed,free:sw.freePorts}
  };

  function drawSwitchBlock(parentSvg,xOff,yOff,def,eqW){
    const swH=70;
    const sg=sGrp(parentSvg,{transform:`translate(${xOff},${yOff})`});
    sRect(sg,{x:0,y:0,width:eqW,height:swH,rx:4,fill:'#1a202c',stroke:def.color,'stroke-width':1.5,filter:'url(#sh)'});
    sRect(sg,{x:0,y:0,width:eqW,height:20,rx:4,fill:def.color,opacity:0.85});
    const isCluster=def.role==='cluster';
    const label=isCluster?`${def.name} (${def.ports}p QSFP28, 1U)`:`${def.name} (1U — Top of Rack)`;
    sText(sg,eqW/2,14,label,{fill:'#fff','font-size':'12px','text-anchor':'middle','font-weight':'700'});
    if(isCluster&&def.consumed!==undefined)
      sText(sg,eqW-8,14,`${def.consumed} used / ${def.free} free`,{fill:'rgba(255,255,255,0.75)','font-size':'10px','text-anchor':'end'});
    const swId=def.name.toLowerCase().replace(/ /g,'-');
    makePort(sg,eqW-36,28,22,14,{id:`${swId}-mgmt`,media:'RJ45',speed:'1GbE',role:'management',ctrl:'sw',slot:swId,port:0,ha:-1});
    sText(sg,eqW-25,56,'Mgmt',{fill:'#a0aec0','font-size':'9px','text-anchor':'middle','font-weight':'600'});
    const pw=Math.min(16,Math.floor((eqW-60)/def.ports)-2);
    for(let p=0;p<def.ports;p++){
      const px=10+p*(pw+2);
      const portUsed=isCluster&&sw.needSwitch&&p<(sw.perSwNodePorts||0);
      const portISL=isCluster&&sw.needSwitch&&p>=(def.ports-(sw.perSwIslPorts||0))&&p<def.ports;
      const portSpare=isCluster&&sw.needSwitch&&!portUsed&&!portISL&&p<(sw.perSwConsumed||0);
      makePort(sg,px,26,pw,16,{id:`${swId}-p${p+1}`,media:def.media,speed:def.speed,role:def.role,ctrl:'sw',slot:swId,port:p+1,ha:-1});
      if(isCluster){
        const lbl=portUsed?'N':portISL?'I':portSpare?'S':(p+1).toString();
        const clr=portUsed?'#10b981':portISL?'#f59e0b':portSpare?'#6366f1':'#718096';
        sText(sg,px+pw/2,58,lbl,{fill:clr,'font-size':'8px','text-anchor':'middle','font-weight':'600'});
      }else{
        sText(sg,px+pw/2,58,`${p+1}`,{fill:'#718096','font-size':'8px','text-anchor':'middle'});
      }
    }
    if(isCluster) sText(sg,10,swH-4,'N=Node  I=ISL  S=Spare',{fill:'#718096','font-size':'9px'});
    return swH;
  }

  // Sort rackItems by cabinet, then top-to-bottom (descending startU)
  const sortedRack=[...rackItems].sort((a,b)=>a.cabIdx!==b.cabIdx?a.cabIdx-b.cabIdx:b.startU-a.startU);
  const cabGroups={};
  for(const ri of sortedRack){
    if(!cabGroups[ri.cabIdx]) cabGroups[ri.cabIdx]=[];
    cabGroups[ri.cabIdx].push(ri);
  }
  const cabIdxList=Object.keys(cabGroups).map(Number).sort((a,b)=>a-b);
  if(!cabIdxList.length) cabIdxList.push(0);

  const drawnHA=new Set();
  const drawnShelves=new Set();

  for(const ci of cabIdxList){
    // Cabinet header
    const cabHdrG=sGrp(svg,{transform:`translate(${pad},${Y})`});
    sRect(cabHdrG,{x:0,y:0,width:equipW,height:22,rx:4,fill:'#0067C5'});
    sText(cabHdrG,equipW/2,15,`Cabinet ${ci+1}`,{fill:'#fff','font-size':'12px','text-anchor':'middle','font-weight':'700'});
    const cabItemCount=(cabGroups[ci]||[]).length;
    sText(cabHdrG,equipW-10,15,`${cabItemCount} items`,{fill:'rgba(255,255,255,0.7)','font-size':'10px','text-anchor':'end'});
    Y+=28;
    const cabAnchors=[];

    for(const ri of (cabGroups[ci]||[])){
      if(ri.type==='cust-switch'||ri.type==='cluster-switch'){
        const def=switchDefMap[ri.id];
        if(!def) continue;
        const h=drawSwitchBlock(svg,pad,Y,def,equipW);
        cabAnchors.push({name:def.name,y:Y+h/2});
        equipAnchors.push({type:'switch',name:def.name,y:Y+h/2});
        Y+=h+8;
      } else if(ri.type==='controller'){
        const ha=ri.ha;
        if(drawnHA.has(ha)) continue;
        drawnHA.add(ha);
        const chY=Y;
        const g=sGrp(svg,{transform:`translate(${pad},${Y})`});
        Y+=drawChassisBack(g,m,ha,equipW);
        cabAnchors.push({name:`${hwCfg.platform.model} Ctrl A — ${getHaLabel(ha)}`,y:chY+56});
        cabAnchors.push({name:`${hwCfg.platform.model} Ctrl B — ${getHaLabel(ha)}`,y:chY+120});
        equipAnchors.push({type:'controller',name:`${hwCfg.platform.model} Ctrl A — ${getHaLabel(ha)}`,y:chY+56});
        equipAnchors.push({type:'controller',name:`${hwCfg.platform.model} Ctrl B — ${getHaLabel(ha)}`,y:chY+120});
        Y+=8;
      } else if(ri.type==='shelf'){
        const ha=ri.ha;
        const shelfKey=ri.id;
        if(drawnShelves.has(shelfKey)) continue;
        drawnShelves.add(shelfKey);
        const parts=ri.id.match(/shelf-(\d+)-(\d+)/);
        const shelfIdx=parts?parseInt(parts[2],10):0;
        const shY=Y;
        const sg=sGrp(svg,{transform:`translate(${pad},${Y})`});
        Y+=drawShelfBack(sg,shelfIdx,equipW,ha);
        cabAnchors.push({name:`NS224 Shelf ${shelfIdx+1} — ${getHaLabel(ha)}`,y:shY+25});
        equipAnchors.push({type:'shelf',name:`NS224 Shelf ${shelfIdx+1} — ${getHaLabel(ha)}`,y:shY+25});
        Y+=8;
      }
    }

    // Per-cabinet PDU strips
    if(cabAnchors.length){
      const pduY0=Math.min(...cabAnchors.map(a=>a.y))-16;
      const pduY1=Math.max(...cabAnchors.map(a=>a.y))+16;
      const pduH=Math.max(60,pduY1-pduY0+22);
      for(let pduSide=0;pduSide<2;pduSide++){
        const px=pduSide===0?leftPduX:rightPduX;
        const pduLabel=pduSide===0?`PDU ${ci+1}A`:`PDU ${ci+1}B`;
        const pg=sGrp(svg,{transform:`translate(${px},${pduY0-10})`});
        sRect(pg,{x:0,y:0,width:pduW,height:pduH,rx:3,fill:'#1a1a2e',stroke:'#E53E3E','stroke-width':1.1,filter:'url(#sh)'});
        sText(pg,pduW/2,10,pduLabel,{fill:'#fc8181','font-size':'9px','text-anchor':'middle','font-weight':'700'});
        cabAnchors.forEach(a=>{
          const oy=(a.y-(pduY0-10))-4;
          sRect(pg,{x:4,y:oy,width:pduW-8,height:8,rx:1,fill:'#2d2d44',stroke:'#E53E3E','stroke-width':0.3});
          const tx=(pduSide===0)?pad+24:pad+equipW-24;
          const cx1=(pduSide===0)?px+pduW+18:px-18;
          const cx2=(pduSide===0)?tx-26:tx+26;
          sPath(svg,`M${px+(pduSide===0?pduW:0)},${a.y} C${cx1},${a.y} ${cx2},${a.y} ${tx},${a.y}`,CABLE_COLORS.power,1.2,'2,2');
        });
      }
      Y=Math.max(Y,pduY1+30);
    }
    Y+=16;
  }

  // ─── CABLE LEGEND (right side, top) ─── */
  const cmX=pad+equipW+46, cmW=380;
  let cmY=pad;
  const lgG=sGrp(svg,{transform:`translate(${cmX},${cmY})`});
  sRect(lgG,{x:0,y:0,width:cmW,height:20+CABLE_LEGEND.length*18,rx:6,fill:'#FFFFFF',stroke:'#E0E0E0','stroke-width':1});
  sText(lgG,cmW/2,16,'Cable Color Legend',{fill:'#1C1C1C','font-size':'13px','text-anchor':'middle','font-weight':'700'});
  CABLE_LEGEND.forEach((leg,i)=>{
    const ly=26+i*20;
    const da=leg.dash||'';
    sLine(lgG,12,ly+6,44,ly+6,CABLE_COLORS[leg.role]||'#888',3,da||undefined);
    sText(lgG,52,ly+10,leg.label,{fill:'#1C1C1C','font-size':'12px'});
  });
  cmY+=30+CABLE_LEGEND.length*20;

  // ─── CABLE & CONNECTIVITY SUMMARY (right side, below legend) ─── */
  const cableInv=buildCableInventory();

  function drawInvSection(parentG,startY,title,titleClr,borderClr,bgClr,items,showBar){
    const sg=sGrp(parentG,{transform:`translate(${cmX},${startY})`});
    sRect(sg,{x:0,y:0,width:cmW,height:28,rx:6,fill:bgClr,stroke:borderClr,'stroke-width':1});
    sText(sg,12,18,title,{fill:titleClr,'font-size':'13px','font-weight':'700'});

    for(const item of items){

        sRect(ig,{x:10,y:0,width:barW,height:28,rx:4,fill:'#F5F5F5',stroke:'#E0E0E0','stroke-width':0.5});
        sRect(ig,{x:10,y:0,width:Math.max(0,barW*ratio),height:28,rx:4,fill:typeClr,opacity:0.15});
        sLine(ig,10,0,10,28,typeClr,4);
        sText(ig,18,12,item.label,{fill:'#1C1C1C','font-size':'10px','font-weight':'600'});
        sText(ig,18,24,`${item.used} / ${item.total}`,{fill:'#6F6F6F','font-size':'9px'});
        const avail=Math.max(0,item.total-item.used);
        sText(ig,barW,18,`${avail} avail`,{fill:avail>0?'#0E6027':'#6F6F6F','font-size':'10px','text-anchor':'end','font-weight':'600'});
      }else{
        sRect(ig,{x:10,y:0,width:barW,height:28,rx:4,fill:'#F5F5F5',stroke:'#E0E0E0','stroke-width':0.5});
        sLine(ig,10,0,10,28,borderClr,4);
        sText(ig,18,12,item.label,{fill:'#1C1C1C','font-size':'10px','font-weight':'600'});
        sText(ig,barW,12,`${item.total}`,{fill:titleClr,'font-size':'12px','text-anchor':'end','font-weight':'700'});
        if(item.note) sText(ig,18,24,item.note,{fill:'#6F6F6F','font-size':'9px'});
      }
      row+=34;
    }
    const totalH=row+6;
    sRect(sg,{x:0,y:0,width:cmW,height:totalH,rx:6,fill:'none',stroke:borderClr,'stroke-width':1});
    return totalH;
  }

  const h1=drawInvSection(svg,cmY,'🔧 NetApp-Supplied Cables (Included in BOM)','#1C1C1C','#0067C5','#E8F4FD',cableInv.netapp,true);
  cmY+=h1+8;
  const h2=drawInvSection(svg,cmY,'🔶 Customer-Required Network Connections','#0E6027','#0E6027','#FEF3C7',cableInv.customer,false);
  cmY+=h2+8;
  const h3=drawInvSection(svg,cmY,'💎 Optics / Transceivers','#1C1C1C','#805AD5','#F3E8FF',cableInv.optics,false);
  cmY+=h3+8;

  // ─── Rack sync banner ───
  const rackSynced=rackItems.length>0;
  const rackJustUpdated=_rackLayoutVersion>0&&_cablingLastSyncVersion===_rackLayoutVersion;
  if(rackSynced){
    const bannerG=sGrp(svg,{transform:`translate(${cmX},${cmY})`});
    const bannerClr=rackJustUpdated?'#0E6027':'#0067C5';
    const bannerBg=rackJustUpdated?'#ECFDF5':'#E8F4FD';
    const bannerTxt=rackJustUpdated
      ?'✓ Cable lengths recalculated from rack layout (v'+_rackLayoutVersion+')'
      :'Cable lengths computed from rack positions';
    sRect(bannerG,{x:0,y:0,width:cmW,height:22,rx:6,fill:bannerBg,stroke:bannerClr,'stroke-width':1});
    sText(bannerG,cmW/2,15,bannerTxt,{fill:bannerClr,'font-size':'10px','text-anchor':'middle','font-weight':'700'});
    cmY+=28;
  }

  // ─── Connection Matrix (from/to/length/compat) with section headers ───
  const rows=buildCableConnectionRows();
  const selectedLenM=parseLenMeters(q('h-cable')?q('h-cable').value:'1m');
  const sectionOrder=['cluster','network','storage','management','power','other'];
  const sectionLabels={cluster:'Cluster / HA Interconnect',network:'Host / Data Network',storage:'Storage / Shelf',management:'Management',power:'Power',other:'Other'};
  const sectionColors={cluster:'#805AD5',network:'#0E6027',storage:'#0097A7',management:'#6F6F6F',power:'#E53E3E',other:'#1C1C1C'};
  const grouped={};
  rows.forEach(r=>{const k=r.roleKey||'other';if(!grouped[k])grouped[k]=[];grouped[k].push(r);});
  const rowH=16, headerH=22, colLabelH=18;
  let matrixRows=0;
  sectionOrder.forEach(k=>{if(grouped[k]&&grouped[k].length){matrixRows+=1;matrixRows+=grouped[k].length;}});
  const tblH=Math.max(50,30+colLabelH+matrixRows*rowH);
  const tbg=sGrp(svg,{transform:`translate(${cmX},${cmY})`});
  sRect(tbg,{x:0,y:0,width:cmW,height:tblH,rx:6,fill:'#FFFFFF',stroke:'#E0E0E0','stroke-width':1});
  sText(tbg,10,18,'Cable Connection Matrix',{'font-size':'13px',fill:'#1C1C1C','font-weight':'700'});
  sText(tbg,cmW-10,18,`${rows.length} connections`,{fill:'#6F6F6F','font-size':'9px','text-anchor':'end'});
  let ty=30;
  sText(tbg,10,ty+10,'From → To',{fill:'#6F6F6F','font-size':'10px','font-weight':'600'});
  sText(tbg,245,ty+10,'Rack Len',{fill:'#6F6F6F','font-size':'10px','text-anchor':'middle','font-weight':'600'});
  sText(tbg,305,ty+10,'Selected',{fill:'#6F6F6F','font-size':'10px','text-anchor':'middle','font-weight':'600'});
  sText(tbg,365,ty+10,'Fit?',{fill:'#6F6F6F','font-size':'10px','text-anchor':'middle','font-weight':'600'});
  ty+=colLabelH;
  let anyRows=false;
  sectionOrder.forEach(secKey=>{
    const secRows=grouped[secKey];
    if(!secRows||!secRows.length) return;
    anyRows=true;
    sRect(tbg,{x:4,y:ty,width:cmW-8,height:headerH,rx:3,fill:sectionColors[secKey]||'#1C1C1C',opacity:0.1});
    sLine(tbg,4,ty,12,ty,sectionColors[secKey]||'#1C1C1C',3);
    sText(tbg,16,ty+14,sectionLabels[secKey]||secKey,{fill:sectionColors[secKey]||'#1C1C1C','font-size':'11px','font-weight':'700'});
    const maxLen=Math.max(...secRows.map(r=>parseFloat(r.used)||0));
    sText(tbg,cmW-14,ty+14,`${secRows.length} · max ${maxLen.toFixed(1)}m`,{fill:'#6F6F6F','font-size':'10px','text-anchor':'end'});
    ty+=headerH;
    secRows.forEach(r=>{
      const usedM=parseFloat(r.used)||0;
      const exempt=r.roleKey==='power'||r.roleKey==='management';
      const fits=exempt||usedM<=selectedLenM;
      const lenClr=fits?'#0E6027':'#C62828';
      sText(tbg,10,ty+11,`${r.from} → ${r.to}`,{fill:'#1C1C1C','font-size':'10px'});
      sText(tbg,245,ty+11,r.used,{fill:exempt?'#6F6F6F':lenClr,'font-size':'10px','text-anchor':'middle','font-weight':'700'});
      sText(tbg,305,ty+11,r.selected,{fill:'#1C1C1C','font-size':'10px','text-anchor':'middle'});
      const fitIcon=exempt?'—':fits?'✓':'✗';
      const fitClr=exempt?'#6F6F6F':fits?'#0E6027':'#C62828';
      sText(tbg,365,ty+11,fitIcon,{fill:fitClr,'font-size':'12px','text-anchor':'middle','font-weight':'700'});
      if(!fits) sRect(tbg,{x:4,y:ty,width:cmW-8,height:rowH,rx:2,fill:'#FEE2E2',opacity:0.3});
      ty+=rowH;
    });
  });
  if(!anyRows){
    sText(tbg,10,ty+14,'No cables connected yet. Click Auto-Cable or drag between ports.',{fill:'#6F6F6F','font-size':'11px'});
    ty+=24;
  }
  const finalTblH=ty+8;
  tbg.querySelector('rect').setAttribute('height',finalTblH);
  cmY+=finalTblH;

  const totalH=Math.max(Y+pad, cmY+pad)+24;
  const contentLeft=Math.min(0,leftPduX-26,pad-20);
  const contentRight=Math.max(W,cmX+cmW+30,rightPduX+pduW+26);
  const totalW=contentRight-contentLeft;
  svg.setAttribute('viewBox',`${contentLeft} 0 ${totalW} ${totalH}`);
  svg.style.width=totalW+'px'; svg.style.height=totalH+'px';
}

function buildCableInventory(){
  const dist=q('s-dist')?q('s-dist').value:'In-cabinet';
  const feSpeed=q('s-fespeed')?q('s-fespeed').value:'25GbE';
  const rule=CABLE_RULES.find(r=>r.dist===dist&&r.speed===feSpeed);
  const sugLen=rule?rule.suggested:'1m';
  const haPairs=hwCfg.haPairs;
  const shelves=hwCfg.totalShelves||0;
  const sw=hwCfg.sw||{};
  const controllers=haPairs*2;

  function countUsed(role){return cableConns.filter(c=>c.fromData?.role===role||c.toData?.role===role).length;}
  function countUsedMulti(...roles){return cableConns.filter(c=>roles.includes(c.fromData?.role)||roles.includes(c.toData?.role)).length;}

  let adapterHostPortsPerHA=0;
  for(const row of [...document.querySelectorAll('#adapt-body tr')]){
    const tp=row.querySelector('.at-type')?.value;
    const qty=+(row.querySelector('.at-qty')?.value||0);
    const cat=ADAPTER_CATALOG[tp]; if(!cat||!qty)continue;
    if(tp.startsWith('Host')||tp==='FC 64G') adapterHostPortsPerHA+=qty*cat.ports;
  }
  const totalHostPorts=adapterHostPortsPerHA*haPairs;

  const netUsed=countUsedMulti('network','host 25gbe','host 100gbe','host 200gbe','data');
  const netDrops=Math.max(totalHostPorts,netUsed);
  const stoUsed=countUsedMulti('storage','shelf sas');
  const mgUsed=countUsed('management');
  const swMgmtCount=2+((sw.needSwitch)?2:0);
  const clUsed=sw.needSwitch?countUsed('cluster'):0;

  const netapp=[];
  if(sw.needSwitch){
    netapp.push({label:`Cluster node-to-switch cable (QSFP28 ${sw.sugLen||sugLen})`,total:Math.max(sw.nodeToSwitchLinks||0,clUsed),used:clUsed,type:'cluster'});
  }
  netapp.push({label:'100GbE QSFP28 shelf cable',total:Math.max(shelves*4,stoUsed),used:stoUsed,type:'shelf'});
  netapp.push({label:'Management RJ45 cable',total:Math.max(controllers+swMgmtCount,mgUsed),used:mgUsed,type:'mgmt'});
  const switchCount=sw.needSwitch?sw.pairCount*2:0;
  const custSwitchCount=2;
  const pwrCordTotal=(controllers+shelves+switchCount+custSwitchCount)*2;
  netapp.push({label:'C13-C14 power cord (dual-feed)',total:pwrCordTotal,used:pwrCordTotal,type:'power'});

  const customer=[];
  const mediaLabel=feSpeed==='25GbE'?'SFP28':'QSFP28';
  customer.push({label:`Network drops to customer switch (${feSpeed})`,total:netDrops,used:netUsed,type:'host',note:'Customer-provided cables'});
  customer.push({label:`Switch ports required (${feSpeed})`,total:netDrops,used:netUsed,type:'host',note:'Ports on customer ToR switches'});

  const optics=[];
  optics.push({label:`${feSpeed} ${mediaLabel} — controller side (NetApp)`,total:netDrops,used:netUsed,type:'host',scope:'netapp',note:'Installed by NetApp on controller data ports'});
  optics.push({label:`${feSpeed} ${mediaLabel} — switch side (Customer)`,total:netDrops,used:netUsed,type:'host',scope:'customer',note:'Required on customer switch ports'});
  if(sw.needSwitch){
    const clTotal=Math.max(sw.nodeToSwitchLinks||0,clUsed);
    optics.push({label:`100GbE QSFP28 — cluster switch (NetApp)`,total:clTotal,used:clUsed,type:'cluster',scope:'netapp',note:'Pre-installed on cluster switch ports'});
  }

  return {netapp,customer,optics,summary:{
    netapp_supplied_cables:{shelf_cables:Math.max(shelves*4,stoUsed),cluster_switch_cables:sw.needSwitch?Math.max(sw.nodeToSwitchLinks||0,clUsed):0,management_cables:Math.max(controllers+swMgmtCount,mgUsed),power_cords:pwrCordTotal},
    customer_required:{network_drops:netDrops,switch_ports_required:netDrops,controller_side_optics_netapp:netDrops,switch_side_optics_customer:netDrops,customer_cables:'customer_scope'}
  }};
}

function parseLenMeters(v){
  const n=parseFloat(v||'0');
  return isNaN(n)?0:n;
}
function getPortLabel(pd){
  if(!pd) return 'Unknown';
  if(pd.slot==='overhead') return `Overhead RJ45 Drop P${pd.port}`;
  if(pd.ctrl==='sw') return pd.port===0?`${pd.slot} Mgmt`:`${pd.slot} P${pd.port}`;
  if(pd.slot==='mgmt') return `HA${(pd.ha||0)+1} Ctrl ${pd.ctrl} Mgmt`;
  if(pd.slot==='shelf') return `HA${(pd.ha||0)+1} Shelf IOM ${pd.ctrl} P${pd.port}`;
  return `HA${(pd.ha||0)+1} Ctrl ${pd.ctrl} Slot ${pd.slot} P${pd.port}`;
}
function findRackItem(portData){
  if(!portData||!rackItems.length) return null;
  const d=portData;
  if(d.ctrl==='sw'){
    const slotId=(d.slot||'').toLowerCase();
    if(slotId.indexOf('customer-switch-a')>=0) return rackItems.find(r=>r.id==='cust-sw-a');
    if(slotId.indexOf('customer-switch-b')>=0) return rackItems.find(r=>r.id==='cust-sw-b');
    if(slotId.indexOf('cluster-a')>=0) return rackItems.find(r=>r.id==='cl-sw-a');
    if(slotId.indexOf('cluster-b')>=0) return rackItems.find(r=>r.id==='cl-sw-b');
    return null;
  }
  if(d.slot==='overhead'||d.slot==='patch') return null;
  if(d.slot==='shelf'){
    const shIdx=(d.port<=2?0:1);
    const iomLetter=(d.ctrl||'A');
    for(const ri of rackItems){
      if(ri.type==='shelf'&&ri.ha===d.ha) return ri;
    }
    return null;
  }
  if(typeof d.ha==='number'&&d.ha>=0){
    const cid=(d.ctrl||'A').toUpperCase();
    return rackItems.find(r=>r.type==='controller'&&r.ha===d.ha&&r.id.endsWith('-'+cid.toLowerCase()));
  }
  return null;
}

function estLenMeters(conn){
  const a=conn.fromData||{}, b=conn.toData||{};
  const role=(a.role||b.role||'data').toLowerCase();

  const riA=findRackItem(a), riB=findRackItem(b);
  if(riA&&riB){
    const cabDist=Math.abs((riA.cabIdx||0)-(riB.cabIdx||0));
    const uDist=Math.abs(((riA.startU||0)+riA.ru/2)-((riB.startU||0)+riB.ru/2));
    const vertM=uDist*0.045;
    if(cabDist===0) return Math.max(0.5, Math.round((vertM+0.3)*10)/10);
    const interCabM=cabDist*1.5;
    return Math.round((interCabM+vertM)*10)/10;
  }

  if(role==='management') return (a.slot==='overhead'||b.slot==='overhead')?3.0:1.5;
  if(role==='storage'||role==='shelf sas') return 1.0;
  if(role==='cluster'){
    const dist=q('s-swdist')?q('s-swdist').value:'In-cabinet';
    if(dist==='Adjacent rack') return 5.0;
    if(dist==='Same row') return 10.0;
    return 1.0;
  }
  if(role==='network'||role.indexOf('host')===0||role==='data'){
    const dist=q('s-dist')?q('s-dist').value:'In-cabinet';
    if(dist==='Adjacent rack') return 5.0;
    if(dist==='Same row') return 10.0;
    return 1.0;
  }
  if(role==='power') return 1.0;
  return 1.0;
}
function buildCableConnectionRows(){
  const selectedLen=parseLenMeters(q('h-cable')?q('h-cable').value:'1m');
  return cableConns.map((c,idx)=>{
    const roleRaw=(c.fromData?.role||c.toData?.role||'data');
    const role=normalizeCableRole(roleRaw);
    const used=estLenMeters(c);
    return{
      idx:idx+1,
      from:getPortLabel(c.fromData),
      to:getPortLabel(c.toData),
      role:roleRaw,
      roleKey:role,
      used:used.toFixed(1)+'m',
      selected:(role==='power')?'n/a':(Math.max(selectedLen,used).toFixed(1)+'m'),
      ok:true
    };
  }).filter(r=>cableRoleFilter==='all'||r.roleKey===cableRoleFilter);
}

function normalizeCableRole(role){
  const r=String(role||'data').toLowerCase();
  if(r==='management') return 'management';
  if(r==='power') return 'power';
  if(r==='cluster'||r==='isl') return 'cluster';
  if(r==='storage'||r==='shelf sas') return 'storage';
  if(r==='network'||r.indexOf('host')===0||r==='data') return 'network';
  return 'other';
}

function showCableTip(e,conn){
  let tip=q('cable-tip');
  if(!tip){tip=document.createElement('div');tip.id='cable-tip';tip.className='ptip';q('cwrap').appendChild(tip);}
  const row=buildCableConnectionRows().find(r=>r.from===getPortLabel(conn.fromData)&&r.to===getPortLabel(conn.toData))||{
    from:getPortLabel(conn.fromData),to:getPortLabel(conn.toData),role:conn.fromData?.role||conn.toData?.role||'data',
    used:estLenMeters(conn).toFixed(1)+'m',selected:(parseLenMeters(q('h-cable')?q('h-cable').value:'1m').toFixed(1)+'m'),ok:true
  };
  tip.innerHTML=`<div class="ptip-title">Cable Details</div>
    <div class="ptip-row"><span>Role:</span><strong>${row.role}</strong></div>
    <div class="ptip-row"><span>From:</span><strong>${row.from}</strong></div>
    <div class="ptip-row"><span>To:</span><strong>${row.to}</strong></div>
    <div class="ptip-row"><span>Used:</span><strong>${row.used}</strong></div>
    <div class="ptip-row"><span>Selected:</span><strong>${row.selected}</strong></div>
    <div class="ptip-row"><span>Compatibility:</span><strong style="color:#16a34a">✓ Compatible</strong></div>`;
  const cw=q('cwrap'),cr=cw.getBoundingClientRect();
  tip.style.left=Math.min(e.clientX-cr.left+12,cr.width-290)+'px';
  tip.style.top=(e.clientY-cr.top-10)+'px';
  tip.style.display='block';
}
function hideCableTip(){const tip=q('cable-tip');if(tip)tip.style.display='none';}

/* ── AUTO-DEFAULT CABLING ── */
function isNetworkRole(r){return r==='network'||r==='host 25gbe'||r==='host 100gbe'||r==='host 200gbe'||r==='data';}
function isStorageRole(r){return r==='storage'||r==='shelf sas';}

function autoDefaultCabling(){
  cableConns=[];
  if(!Object.keys(portElMap).length) renderSim();
  const sw=hwCfg.sw||{};
  let clSwPortA=1,clSwPortB=1;
  let custSwPortA=1,custSwPortB=1;
  let mgmtDropPort=1;

  for(let ha=0;ha<hwCfg.haPairs;ha++){
    for(const cid of ['A','B']){
      const ctrlPorts=Object.values(portElMap).filter(p=>p&&p.data&&p.data.ha===ha&&p.data.ctrl===cid&&typeof p.data.slot==='number');

      // --- Cluster ports → cluster switch ---
      if(sw.needSwitch){
        const swName=cid==='A'?'cisco-3636-cluster-a':'cisco-3636-cluster-b';
        let swPort=cid==='A'?clSwPortA:clSwPortB;
        const clPorts=ctrlPorts.filter(p=>p.data.role==='cluster');
        for(const cp of clPorts){
          const swPid=`${swName}-p${swPort}`;
          if(portElMap[swPid]){
            cableConns.push({from:cp.data.id,to:swPid,fromData:cp.data,toData:portElMap[swPid].data});
            swPort++;
          }
        }
        if(cid==='A')clSwPortA=swPort;else clSwPortB=swPort;
      }

      // --- Host / network ports → customer switch ---
      const custSw=cid==='A'?'customer-switch-a':'customer-switch-b';
      let custPort=cid==='A'?custSwPortA:custSwPortB;
      const netPorts=ctrlPorts.filter(p=>isNetworkRole(p.data.role));
      for(const np of netPorts){
        const swPid=`${custSw}-p${custPort}`;
        if(portElMap[swPid]){
          cableConns.push({from:np.data.id,to:swPid,fromData:np.data,toData:portElMap[swPid].data});
          custPort++;
        }
      }
      if(cid==='A')custSwPortA=custPort;else custSwPortB=custPort;

      // --- Shelf / storage ports → shelf IOM ports ---
      const stoPorts=ctrlPorts.filter(p=>isStorageRole(p.data.role));
      const haShelves=(hwCfg.shelvesPerHaPair&&hwCfg.shelvesPerHaPair[ha]!==undefined)?hwCfg.shelvesPerHaPair[ha]:hwCfg.shelvesPerHA;
      if(stoPorts.length&&haShelves>0){
        let sp=0;
        for(let s=1;s<=haShelves;s++){
          for(let pi=1;pi<=2;pi++){
            const shelfPid=`ha${ha}-sh${s}-iom${cid}-p${pi}`;
            if(!portElMap[shelfPid]) continue;
            const ctrlPort=stoPorts[sp%stoPorts.length];
            if(ctrlPort){
              cableConns.push({from:ctrlPort.data.id,to:shelfPid,fromData:ctrlPort.data,toData:portElMap[shelfPid].data});
              sp++;
            }
          }
        }
      }

      // --- Controller management → overhead patch panel ---
      const mgPid=`ha${ha}-${cid}-mgmt`;
      const mgPort=portElMap[mgPid];
      const ovPid=`overhead-mgmt-p${mgmtDropPort}`;
      const ovPort=portElMap[ovPid];
      if(mgPort&&ovPort){
        cableConns.push({from:ovPid,to:mgPid,fromData:ovPort.data,toData:mgPort.data});
        mgmtDropPort++;
      }
    }
  }

  // --- Switch management ports → overhead patch panel ---
  const switchMgmtIds=['customer-switch-a-mgmt','customer-switch-b-mgmt'];
  if(sw.needSwitch){
    switchMgmtIds.push('cisco-3636-cluster-a-mgmt','cisco-3636-cluster-b-mgmt');
  }
  for(const smId of switchMgmtIds){
    const smPort=portElMap[smId];
    const ovPid=`overhead-mgmt-p${mgmtDropPort}`;
    const ovPort=portElMap[ovPid];
    if(smPort&&ovPort){
      cableConns.push({from:ovPid,to:smId,fromData:ovPort.data,toData:smPort.data});
      mgmtDropPort++;
    }
  }
}

/* ── RACK VIEW — drag-and-drop rack placement with RU markers ── */
function renderRack(svg,m){
  const c=hwCfg;
  const cabU=cabConfig.height_u||42;
  const pduW=22, equipGap=pduW+4;
  const cabW=260+equipGap*2, cabH=Math.round(cabU*16.67), uH=cabH/cabU;

  if(!rackItems.length) rackItems=buildDefaultRackItems();

  // ── Cabinet spec header ──

  const issues=checkCabinetCompat();
  const specY=8;
  const specG=sGrp(svg,{transform:`translate(60,${specY})`});
  const specW=numCabs*(cabW+cabSpacing)+40;
  const rackKit=q('h-rack')?q('h-rack').value:'4post';
  const rackKitLabel=rackKit==='superrail'?'Super Rail':'4-Post Rail Kit';
  const cabPwr=q('h-cabpwr')?q('h-cabpwr').value:'in';
