<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Subscription Engine</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="login.css">
</head>
<body class="login-page">
  <header class="login-top-bar">
    <div class="login-top-bar-left">
      <span class="logo-icon">N</span>
      <span class="login-top-bar-title">Subscription Engine</span>
    </div>
    <div class="login-top-bar-right">
      <a href="../" class="header-console-link" title="Return to the Console home screen">&#8592; Console</a>
      <span class="login-top-bar-persona-label">Switch persona</span>
      <select class="login-top-bar-select" id="login-persona-select" aria-label="Switch persona">
        <option value="sales">Derek Keller (Sales)</option>
        <option value="deal-desk">Laura Ramirez (Deal Desk)</option>
        <option value="customer">AUMOVIO Germany GmbH (Customer)</option>
      </select>
    </div>
  </header>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <a href="#" class="logo login-logo">
          <span class="logo-icon">N</span>
          <span class="logo-text">Subscription Engine</span>
        </a>
        <h1 class="login-title">Sign in to your account</h1>
        <p class="login-subtitle">Enter your credentials to continue</p>
      </div>

      <form class="login-form" id="login-form" novalidate>
        <div class="login-persona-badge" id="login-persona-badge" hidden>
          <span class="login-persona-badge-icon" id="login-persona-badge-icon"></span>
          <span class="login-persona-badge-text" id="login-persona-badge-text"></span>
        </div>

        <div class="login-field">
          <label for="login-email">Email address</label>
          <input type="email" id="login-email" autocomplete="email" placeholder="name@company.com">
        </div>

        <div class="login-field">
          <label for="login-password">Password</label>
          <div class="login-password-wrap">
            <input type="password" id="login-password" autocomplete="current-password" placeholder="Enter your password">
            <button type="button" class="login-password-toggle" id="login-password-toggle" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="login-options">
          <label class="login-remember">
            <input type="checkbox" id="login-remember" checked>
            <span>Remember me</span>
          </label>
          <a href="#" class="login-forgot">Forgot password?</a>
        </div>

        <button type="submit" class="login-submit" id="login-submit">Sign in</button>

      </form>

      <div class="login-footer-links">
        <span>Need help? <a href="#">Contact support</a></span>
      </div>
    </div>

    <div class="login-page-footer">
      <p class="login-page-footer-copy">&copy; 2025 Subscription Engine. All rights reserved.</p>
      <div class="login-page-footer-links">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Contact</a>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
